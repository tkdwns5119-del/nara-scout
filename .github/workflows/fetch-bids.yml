name: Sync Nara Bids

on:
  schedule:
    # 나라장터 입찰공고는 실시간성이 낮으므로 1시간 주기 권장
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-nara-bids
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check NARA_API_KEY
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
        run: |
          if [ -z "$NARA_API_KEY" ]; then
            echo "NARA_API_KEY is empty"
            exit 1
          fi
          echo "NARA_API_KEY exists"

      - name: Fetch bids from data.go.kr
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
        run: node scripts/fetch-nara-bids.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bids.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): sync bids $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
