name: Sync Nara Bids

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-nara-bids
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check required secret
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
        run: |
          if [ -z "$NARA_API_KEY" ]; then
            echo "NARA_API_KEY is empty"
            exit 1
          fi
          echo "NARA_API_KEY exists"

      - name: Fetch procurement data
        env:
          # 필수: 나라장터 API
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}

          # 선택: 서비스별 키가 다른 경우만 사용
          NARA_PRESPEC_API_KEY: ${{ secrets.NARA_PRESPEC_API_KEY }}
          NARA_PLAN_API_KEY: ${{ secrets.NARA_PLAN_API_KEY }}

          # AI 분석 비활성화: 공고 상세 정보 중심 운영
        run: node scripts/fetch-nara-bids.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bids.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): sync procurement data $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
