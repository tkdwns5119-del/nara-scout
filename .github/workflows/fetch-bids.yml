name: Sync Nara Bids

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # 23:00 UTC = 08:00 KST, 05:00 UTC = 14:00 KST, 08:00 UTC = 17:00 KST.
    - cron: '0 23 * * *'
    - cron: '0 5 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-nara-bids
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check required secret
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
        run: |
          if [ -z "$NARA_API_KEY" ]; then
            echo "NARA_API_KEY is empty"
            exit 1
          fi
          echo "NARA_API_KEY exists"

      - name: Fetch procurement data
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          NARA_PRESPEC_API_KEY: ${{ secrets.NARA_PRESPEC_API_KEY }}
          NARA_PLAN_API_KEY: ${{ secrets.NARA_PLAN_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          AI_ANALYSIS_LIMIT: ${{ vars.AI_ANALYSIS_LIMIT }}
        run: node scripts/fetch-nara-bids.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bids.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): sync procurement data $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push origin main
          fi
