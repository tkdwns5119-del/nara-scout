name: Sync Nara Bids

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-nara-bids
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check required secret
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
        run: |
          if [ -z "$NARA_API_KEY" ]; then
            echo "NARA_API_KEY is empty"
            exit 1
          fi
          echo "NARA_API_KEY exists"

      - name: Fetch procurement data from data.go.kr
        env:
          # 필수: 입찰공고
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}

          # 선택: 사전규격 / 발주계획
          # 별도 키가 없으면 스크립트에서 NARA_API_KEY를 재사용합니다.
          NARA_PRESPEC_API_KEY: ${{ secrets.NARA_PRESPEC_API_KEY }}
          NARA_PLAN_API_KEY: ${{ secrets.NARA_PLAN_API_KEY }}

          # 선택: 발주계획 오퍼레이션명이 다를 경우 GitHub Secret/Variable로 덮어쓰기 가능
          NARA_PLAN_THNG_ENDPOINT: ${{ vars.NARA_PLAN_THNG_ENDPOINT }}
          NARA_PLAN_SERVC_ENDPOINT: ${{ vars.NARA_PLAN_SERVC_ENDPOINT }}
          NARA_PRESPEC_ENDPOINT: ${{ vars.NARA_PRESPEC_ENDPOINT }}
        run: node scripts/fetch-nara-bids.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bids.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): sync procurement data $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
