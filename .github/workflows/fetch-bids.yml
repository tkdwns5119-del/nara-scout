name: Sync Nara Bids

on:
  schedule:
    # GitHub delays or drops individual scheduled runs (2-5 hours late was observed with one
    # cron per slot). Instead a cheap gate fires every 15 minutes during working hours and starts
    # the fetch once per slot (KST 07/09/11/13/15/17) as soon as any trigger gets through.
    # UTC 22-23,0-8 = KST 07-17; minutes 7/22/37/52 avoid the top-of-hour queue.
    - cron: '7,22,37,52 22-23,0-8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Fetch even if data was refreshed recently'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout data timestamp
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          sparse-checkout: |
            data/bids.json
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Decide whether to fetch
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          SLOTS_KST: '7,9,11,13,15,17'
          MIN_INTERVAL_MINUTES: '90'
        run: node .github/scripts/should-fetch.mjs

  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    concurrency:
      group: sync-nara-bids
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Latest branch tip, not the SHA at trigger time, so the freshness
          # check sees data committed by a run that finished while this one queued.
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Skip if data is already fresh
        id: freshness
        env:
          FORCE: ${{ inputs.force }}
          # Guards against a second fetch that queued behind one which just finished.
          MIN_INTERVAL_MINUTES: '90'
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Forced run."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            let age = Infinity;
            try { age = (Date.now() - Date.parse(JSON.parse(fs.readFileSync('data/bids.json', 'utf8')).generatedAt)) / 60000; } catch {}
            const skip = age < Number(process.env.MIN_INTERVAL_MINUTES);
            console.log('Data age: ' + (Number.isFinite(age) ? Math.round(age) + ' min' : 'unknown') + (skip ? ' -> skipping' : ''));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'skip=' + skip + '\n');
          "

      - name: Check required secret
        if: steps.freshness.outputs.skip != 'true'
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
        run: |
          if [ -z "$NARA_API_KEY" ]; then
            echo "NARA_API_KEY is empty"
            exit 1
          fi
          echo "NARA_API_KEY exists"

      - name: Fetch procurement data
        if: steps.freshness.outputs.skip != 'true'
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          NARA_PRESPEC_API_KEY: ${{ secrets.NARA_PRESPEC_API_KEY }}
          NARA_PLAN_API_KEY: ${{ secrets.NARA_PLAN_API_KEY }}
          # force 실행은 30일 전체 재수집, 그 외에는 하루 한 번 전체 + 나머지 증분 수집.
          NARA_FETCH_MODE: ${{ inputs.force && 'full' || 'auto' }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          for attempt in 1 2 3; do
            echo "Fetch attempt ${attempt}/3"
            if node scripts/fetch-nara-bids.mjs; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              break
            fi

            wait_seconds=$((attempt * 90))
            echo "Fetch failed. Waiting ${wait_seconds}s before a full retry."
            sleep "$wait_seconds"
          done

          echo "All fetch attempts failed. Keeping the previous data file."
          exit 1

      - name: Commit updated data
        if: steps.freshness.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bids.json data/archive
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): sync procurement data $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push origin main
          fi
