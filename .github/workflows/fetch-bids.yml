name: Sync Nara Bids

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # 00:00 UTC = 09:00 KST, 03:00 UTC = 12:00 KST, 07:00 UTC = 16:00 KST.
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-nara-bids
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check required secret
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
        run: |
          if [ -z "$NARA_API_KEY" ]; then
            echo "NARA_API_KEY is empty"
            exit 1
          fi
          echo "NARA_API_KEY exists"

      - name: Fetch procurement data
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          NARA_PRESPEC_API_KEY: ${{ secrets.NARA_PRESPEC_API_KEY }}
          NARA_PLAN_API_KEY: ${{ secrets.NARA_PLAN_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          AI_ANALYSIS_LIMIT: ${{ vars.AI_ANALYSIS_LIMIT }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          for attempt in 1 2 3; do
            echo "Fetch attempt ${attempt}/3"
            if node scripts/fetch-nara-bids.mjs; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              break
            fi

            wait_seconds=$((attempt * 90))
            echo "Fetch failed. Waiting ${wait_seconds}s before a full retry."
            sleep "$wait_seconds"
          done

          echo "All fetch attempts failed. Keeping the previous data file."
          exit 1

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bids.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): sync procurement data $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push origin main
          fi
