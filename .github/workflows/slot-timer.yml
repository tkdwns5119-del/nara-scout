name: Slot Timer

# GitHub's own schedules run hours late or not at all for this repo, so this workflow keeps time
# itself: each run waits until the next collection slot (KST 07/09/11/13/15/17), starts
# "Sync Nara Bids", then starts the next timer run. Runs dispatched with GITHUB_TOKEN via
# workflow_dispatch do start new workflow runs, so the chain needs no personal token.
on:
  # Pushing a change to the timer starts the chain.
  push:
    branches: [main]
    paths:
      - .github/workflows/slot-timer.yml
      - .github/scripts/slot-timer.mjs
  workflow_dispatch:
  # Restarts the chain if it ever breaks, whenever GitHub manages to fire a schedule.
  # With the concurrency group below, a restart never runs alongside a live timer.
  schedule:
    - cron: '41 */2 * * *'

permissions:
  actions: write
  contents: read

# One timer at a time. A run queued while another is waiting is held, and the newest queued
# run replaces older queued ones, so the chain never splits in two.
concurrency:
  group: slot-timer
  cancel-in-progress: false

jobs:
  wait-and-dispatch:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at 6 hours; the planner waits at most MAX_WAIT_MINUTES.
    timeout-minutes: 350
    steps:
      - name: Checkout timer and data timestamp
        uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: |
            data/bids.json
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Plan next slot
        id: plan
        env:
          SLOTS_KST: '7,9,11,13,15,17'
          MAX_WAIT_MINUTES: '330'
          CATCH_UP_MINUTES: '110'
        run: node .github/scripts/slot-timer.mjs

      # If planning failed, still wait 10 minutes so a broken run can't spin the chain.
      - name: Wait
        if: ${{ !cancelled() }}
        env:
          WAIT_SECONDS: ${{ steps.plan.outputs.wait_seconds }}
        run: sleep "${WAIT_SECONDS:-600}"

      - name: Start collection
        if: steps.plan.outputs.fire == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh workflow run fetch-bids.yml --repo "$GITHUB_REPOSITORY" --ref main -f slot=true && exit 0
            sleep 20
          done
          exit 1

      - name: Start next timer
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh workflow run slot-timer.yml --repo "$GITHUB_REPOSITORY" --ref main && exit 0
            sleep 20
          done
          exit 1
