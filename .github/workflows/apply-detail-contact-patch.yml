name: Apply detail contact patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-detail-contact-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore dashboard and patch contact detail
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64, json, urllib.request

          blob_sha = '877fa02ef2825cc22c43fe49b7508f86d5760903'
          blob_url = f'https://api.github.com/repos/tkdwns5119-del/nara-scout/git/blobs/{blob_sha}'
          payload = json.load(urllib.request.urlopen(blob_url))
          html = base64.b64decode(payload['content']).decode('utf-8')

          patch = r'''
<script id="direct-detail-contact-patch-v4">
(function(){
  function val(x){return x==null||String(x).trim()===''?'-':String(x).trim()}
  function pick(o,ks){for(const k of ks){const v=o&&o[k];if(v!=null&&String(v).trim())return String(v).trim()}const d=o&&(o.detailInfo||o.detail||o.raw)||{};for(const k of ks){const v=d&&d[k];if(v!=null&&String(v).trim())return String(v).trim()}return ''}
  function nameOf(i){return pick(i,['ntceInsttOfclNm','bidNtceChargerNm','bidNtceChgrNm','ofclNm','chargerNm','contactName','managerName','officerName','담당자명','담당자'])}
  function telOf(i){return pick(i,['ntceInsttOfclTelNo','bidNtceChargerTelNo','bidNtceChgrTelNo','ofclTelNo','chargerTelNo','telNo','contactTel','managerTel','officerTel','phone','telephone','담당자전화번호','전화번호'])}
  function emailOf(i){return pick(i,['ntceInsttOfclEmailAdres','ntceInsttOfclEmailAdrs','ntceInsttOfclEmailAddr','bidNtceChargerEmailAdres','ofclEmailAdres','officerEmail','contactEmail','managerEmail','email'])}
  function deptOf(i){return pick(i,['ntceInsttOfclDeptNm','bidNtceChargerDeptNm','ofclDeptNm','chargerDeptNm','deptNm','department','contactDept','managerDept','officerDept'])}
  function money(x){try{return formatKoreanCurrency(Number(x)||0)}catch(e){return (Number(x)||0).toLocaleString('ko-KR')+'원'}}
  function card(l,v,s=''){return `<div class="bg-slate-50 border border-slate-200 rounded-xl p-3"><div class="text-[10px] text-slate-400 font-semibold mb-1">${l}</div><div class="text-xs sm:text-sm font-bold text-slate-800 break-words">${val(v)}</div>${s?`<div class="text-[10px] text-slate-400 mt-1">${s}</div>`:''}</div>`}
  function status(i){try{const s=getImportantState(i.bidNtceNo),a=[];if(s.checked)a.push('체크 사업');if(s.issue)a.push('이슈 검토');return a.length?a.join(' / '):'미검토'}catch(e){return '미검토'}}
  function method(i){try{return getContractMethodLabel(i)}catch(e){return i.contractMethod||i.contractMethodRaw||'계약방법 미확인'}}
  function dday(x){const d=new Date(String(x||'').slice(0,10));if(isNaN(d))return '일정 미확인';const t=new Date();t.setHours(0,0,0,0);const n=Math.ceil((d-t)/86400000);return n>0?'D-'+n:n===0?'D-DAY':'마감 '+Math.abs(n)+'일 경과'}
  function band(n){n=Number(n)||0;return n>=5e8?'5억 이상 / 대형':n>=2e8?'2억~5억 / 중대형':n>=5e7?'5천만~2억 / 일반':n>0?'5천만 이하 / 소형':'예산 미확인'}
  function level(i){const m=method(i),n=Number(i.assignBudgetAmt)||0;if(i.serviceType==='사전규격')return '사전검토 우선';if(n>=2e8)return '중점 검토';if(m.includes('수의'))return '빠른 확인';return '일반 검토'}
  function stage(t){return t==='사전규격'?'공고 전 규격 검토 단계':t==='발주계획'?'향후 발주 예정 단계':'입찰공고 진행 단계'}
  function ensureModal(){let m=document.getElementById('aiAssistantModal');if(!m)return null;m.innerHTML=`<div class="bg-white rounded-3xl max-w-7xl w-full max-h-[92vh] overflow-hidden flex flex-col shadow-2xl border border-slate-200 animate-fade-in"><div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50"><div class="flex items-center space-x-2.5"><span class="p-2 bg-cyan-100 text-cyber-cyan rounded-xl"><i data-lucide="file-search" class="w-5 h-5 text-cyber-cyan"></i></span><div><h3 class="font-extrabold text-slate-900 text-sm sm:text-base">사업 기본 상세정보</h3><p class="text-[10px] sm:text-xs text-slate-500">나라장터 수집 데이터 기준 상세 검토 화면</p></div></div><button onclick="closeAiAssistant()" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button></div><div class="flex-grow p-5 sm:p-6 overflow-y-auto space-y-5"><div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-4"><div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3"><div class="flex flex-wrap items-center gap-2"><span id="d-type" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border"></span><span id="d-status" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border bg-emerald-50 text-emerald-700 border-emerald-200"></span><span id="d-level" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border bg-slate-50 text-slate-700 border-slate-200"></span></div><span id="d-no" class="text-[10px] text-slate-400 font-mono"></span></div><h4 id="d-title" class="font-extrabold text-slate-900 text-base sm:text-xl leading-snug"></h4><div id="d-basic" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3"></div></div><div class="grid grid-cols-1 xl:grid-cols-3 gap-4"><div class="xl:col-span-2 space-y-4"><div class="bg-white border border-slate-200 rounded-2xl overflow-hidden"><div class="p-4 border-b border-slate-100 bg-slate-50 font-bold text-sm text-slate-900">상세 항목</div><div id="d-detail" class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div></div><div class="bg-white border border-slate-200 rounded-2xl overflow-hidden"><div class="p-4 border-b border-slate-100 bg-slate-50 font-bold text-sm text-slate-900">실무 검토 체크포인트</div><div id="d-check" class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-slate-700"></div></div></div><div class="space-y-4"><div class="bg-white border border-slate-200 rounded-2xl overflow-hidden"><div class="p-4 border-b border-slate-100 bg-slate-50 font-bold text-sm text-slate-900">영업 검토 포인트</div><div id="d-review" class="p-4 text-xs sm:text-sm text-slate-700 leading-relaxed space-y-2"></div></div><div class="bg-white border border-slate-200 rounded-2xl overflow-hidden"><div class="p-4 border-b border-slate-100 bg-slate-50 font-bold text-sm text-slate-900">검토용 요약</div><div id="d-summary" class="p-4 text-xs sm:text-sm text-slate-700 leading-relaxed whitespace-pre-line"></div></div><button id="d-link" class="w-full py-3 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 text-xs font-bold flex items-center justify-center gap-1.5"><i data-lucide="external-link" class="w-4 h-4"></i><span>나라장터 원본공고 이동</span></button><button id="d-copy" class="w-full py-3 rounded-xl bg-cyan-50 hover:bg-cyan-100 border border-cyan-200 text-cyber-cyan text-xs font-bold flex items-center justify-center gap-1.5"><i data-lucide="copy" class="w-4 h-4"></i><span>검토 요약 복사</span></button></div></div></div></div>`;return m}
  function show(no){const list=Array.isArray(activeBids)?activeBids:[],i=list.find(x=>x.bidNtceNo===no);if(!i)return;const m=ensureModal();if(!m)return;const t=i.serviceType||'-',n=nameOf(i)||'담당자명 미확인',tel=telOf(i)||'전화번호 미확인',em=emailOf(i),dp=deptOf(i),b=money(i.assignBudgetAmt),bd=band(i.assignBudgetAmt),st=status(i),lv=level(i),sg=stage(t),cl=t==='공고'?'마감일':t==='사전규격'?'의견종료':'예정월',sum=['[사업 검토 요약]','- 사업명: '+val(i.bidNtceNm),'- 유형/번호: '+t+' / '+val(i.bidNtceNo),'- 담당자: '+n,'- 담당자 전화번호: '+tel,dp?'- 담당부서: '+dp:null,em?'- 담당자 이메일: '+em:null,'- 계약방법: '+method(i),'- 공고기관: '+val(i.ntceInsttNm),'- 수요기관: '+val(i.dminsttNm),'- 지역: '+val(i.region),'- 예산: '+b+' ('+bd+')','- '+cl+': '+val(i.bidClseDt)+' / '+dday(i.bidClseDt),'- 검토상태: '+st,'- 검토우선도: '+lv].filter(Boolean).join('\n');document.getElementById('d-type').innerText=t;document.getElementById('d-type').className='px-2.5 py-0.5 rounded-full text-[10px] font-bold border '+(t==='사전규격'?'border-fuchsia-200 bg-fuchsia-50 text-cyber-fuchsia':t==='발주계획'?'border-amber-200 bg-amber-50 text-cyber-amber':'border-cyan-200 bg-cyan-50 text-cyber-cyan');document.getElementById('d-status').innerText=st;document.getElementById('d-level').innerText=lv;document.getElementById('d-no').innerText=val(i.bidNtceNo);document.getElementById('d-title').innerText=val(i.bidNtceNm);document.getElementById('d-basic').innerHTML=card('공고기관',i.ntceInsttNm)+card('수요기관',i.dminsttNm)+card('담당자',n,dp)+card('담당자 전화번호',tel,em)+card('배정 예산',b,bd)+card('마감 상태',dday(i.bidClseDt),cl);document.getElementById('d-detail').innerHTML=card('계약방법',method(i))+card('공고 번호',i.bidNtceNo)+card('담당자명',n)+card('담당자 전화번호',tel)+card('담당부서',dp||'-')+card('담당자 이메일',em||'-')+card('수집 키워드',i.searchKeyword)+card('업무 단계',sg)+card('원본 URL',i.g2bUrl||'https://www.g2b.go.kr');document.getElementById('d-check').innerHTML=['공고문·규격서·과업지시서 원문 확인','LED 규격, 픽셀피치, 표출면 크기 확인','제어기, 통신 방식, 전원/분전함 범위 확인','현장 실측, 구조물 보강, 마감 범위 확인','참가자격, 지역제한, 실적 조건 확인','납기, 설치 기간, 유지보수 조건 확인'].map(x=>`<div class="flex items-start gap-2 bg-slate-50 border border-slate-200 rounded-xl p-2.5"><i data-lucide="check-circle" class="w-3.5 h-3.5 text-cyber-cyan mt-0.5 shrink-0"></i><span>${x}</span></div>`).join('');document.getElementById('d-review').innerHTML=`<div class="rounded-xl bg-cyan-50 border border-cyan-200 p-3"><div class="text-[10px] font-bold text-cyber-cyan mb-1">1차 판단</div><div class="font-semibold text-slate-800">${lv}</div></div><div class="rounded-xl bg-slate-50 border border-slate-200 p-3"><div class="text-[10px] font-bold text-slate-500 mb-1">담당자 확인</div><div>${n==='담당자명 미확인'&&tel==='전화번호 미확인'?'수집 데이터에 담당자 정보가 없으면 원문 공고에서 담당자 항목을 확인해야 합니다.':`담당자 ${n}, 연락처 ${tel} 기준으로 원문 공고와 일치 여부를 확인하세요.`}</div></div>`;document.getElementById('d-summary').innerText=sum;document.getElementById('d-link').onclick=()=>openBidLink(i.g2bUrl||'https://www.g2b.go.kr');document.getElementById('d-copy').onclick=()=>{navigator.clipboard.writeText(sum);try{showToast('검토 요약을 복사했습니다.','copy')}catch(e){}};m.classList.remove('hidden');if(window.lucide)lucide.createIcons()}
  function decorate(){document.querySelectorAll('button[onclick*="openAiAssistant"]').forEach(btn=>{btn.title='상세보기';btn.innerHTML='<i data-lucide="file-search" class="w-3.5 h-3.5"></i>'});if(window.lucide)lucide.createIcons()}
  window.openBidDetail=show;window.openAiAssistant=show;try{openAiAssistant=show}catch(e){};const old=window.renderBidsTable||((typeof renderBidsTable==='function')&&renderBidsTable);if(typeof old==='function'&&!old.__detailContactPatched){const p=function(x){old(x);setTimeout(decorate,0)};p.__detailContactPatched=true;window.renderBidsTable=p;try{renderBidsTable=p}catch(e){}};setTimeout(decorate,200);setInterval(decorate,2000);
})();
</script>
'''
          html = html.replace('</body>', patch + '\n</body>')
          Path('di.html').write_text(html, encoding='utf-8')

          s = Path('scripts/fetch-nara-bids.mjs')
          if s.exists():
            js = s.read_text(encoding='utf-8')
            js = js.replace("department: pick(i, ['deptNm']),", "department: pick(i, ['ntceInsttOfclDeptNm','bidNtceChargerDeptNm','ofclDeptNm','deptNm']),")
            js = js.replace("officerName: pick(i, ['ntceInsttOfclNm', 'ofclNm', 'exctvNm']),", "officerName: pick(i, ['ntceInsttOfclNm','bidNtceChargerNm','bidNtceChgrNm','ofclNm','chargerNm','exctvNm']),")
            js = js.replace("officerTel: pick(i, ['ntceInsttOfclTelNo', 'ofclTelNo', 'telNo']),", "officerTel: pick(i, ['ntceInsttOfclTelNo','bidNtceChargerTelNo','bidNtceChgrTelNo','ofclTelNo','chargerTelNo','telNo']),")
            js = js.replace("officerEmail: pick(i, ['ntceInsttOfclEmailAdrs']),", "officerEmail: pick(i, ['ntceInsttOfclEmailAdres','ntceInsttOfclEmailAdrs','ntceInsttOfclEmailAddr','bidNtceChargerEmailAdres','ofclEmailAdres']),")
            marker = "contractMethodRaw: pick(i, ['cntrctCnclsMthdNm', 'cntrctMthdNm', 'bidMethdNm', 'sucsfbidMthdNm']),"
            add = marker + "\n        ntceInsttOfclNm: pick(i, ['ntceInsttOfclNm','bidNtceChargerNm','bidNtceChgrNm','ofclNm','chargerNm']),\n        ntceInsttOfclTelNo: pick(i, ['ntceInsttOfclTelNo','bidNtceChargerTelNo','bidNtceChgrTelNo','ofclTelNo','chargerTelNo','telNo']),\n        ntceInsttOfclEmailAdres: pick(i, ['ntceInsttOfclEmailAdres','ntceInsttOfclEmailAdrs','ntceInsttOfclEmailAddr','bidNtceChargerEmailAdres','ofclEmailAdres']),\n        ntceInsttOfclDeptNm: pick(i, ['ntceInsttOfclDeptNm','bidNtceChargerDeptNm','ofclDeptNm','deptNm']),"
            if 'ntceInsttOfclTelNo:' not in js:
              js = js.replace(marker, add)
            s.write_text(js, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add di.html scripts/fetch-nara-bids.mjs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: restore dashboard and patch detail contact fields [skip ci]"
            git push
          fi
