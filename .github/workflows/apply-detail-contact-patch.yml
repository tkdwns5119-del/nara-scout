name: Validate dashboard patches

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-detail-contact-patch.yml'
      - 'di.html'
      - 'detail-contact-patch.js'
      - 'ui-polish-patch.js'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate patch files
        shell: bash
        run: |
          set -euo pipefail

          test -f di.html
          test -f detail-contact-patch.js
          test -f ui-polish-patch.js

          node --check detail-contact-patch.js
          node --check ui-polish-patch.js

          grep -q "detail-contact-patch.js" di.html
          grep -q "ui-polish-patch.js" di.html

          echo "Dashboard patch files are valid and loaded from di.html."
