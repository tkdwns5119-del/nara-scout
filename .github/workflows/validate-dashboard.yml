name: Validate dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate-dashboard.yml'
      - 'di.html'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate dashboard
        run: |
          test -f di.html
          node -e "const fs=require('fs'); const html=fs.readFileSync('di.html','utf8'); const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)]; if(!scripts.length) throw new Error('inline script not found'); new Function(scripts.at(-1)[1]); console.log('Dashboard inline JavaScript is valid.');"
