<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="dashboard-patch-version" content="detail-safe-open-80c2f4a">
  <title>DI영업지원 대시보드</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color:#475569;}
    .loading{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:14px;}
    .spin{width:28px;height:28px;border:3px solid #bae6fd;border-top-color:#0891b2;border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading"><div class="spin"></div><div>DI영업지원 대시보드 로딩 중...</div></div>
  <script>
    const SOURCE_HTML = 'https://raw.githubusercontent.com/tkdwns5119-del/nara-scout/6581c8bf4aaebb33d0865d11619d60f615f571f6/di.html';
    const PATCH_VERSION = 'detail-safe-open-80c2f4a';
    async function boot() {
      try {
        document.documentElement.dataset.patchVersion = PATCH_VERSION;
        const res = await fetch(SOURCE_HTML, { cache: 'no-store' });
        if (!res.ok) throw new Error('대시보드 원본 로딩 실패: HTTP ' + res.status);
        let html = await res.text();

        html = html.replace(
          'const firebaseConfig = cfg.firebaseConfig || {};',
          `const firebaseConfig = { ...(cfg.firebaseConfig || {}) };
                if (!firebaseConfig.apiKey && Array.isArray(firebaseConfig.apiKeyParts)) {
                    firebaseConfig.apiKey = firebaseConfig.apiKeyParts.join('');
                }
                delete firebaseConfig.apiKeyParts;`
        );

        html = html.replace(
          `const remoteStore = snapshot.val() || {};
                importantIssueStore = mergeImportantIssueStores(importantIssueStore, remoteStore);
                saveImportantIssueStore({ skipShared: true });`,
          `const remoteStore = snapshot.val();
                importantIssueStore = remoteStore && typeof remoteStore === 'object' ? remoteStore : {};
                saveImportantIssueStore({ skipShared: true });`
        );

        html = html.replace(
          `const remote = snap.val() || {};
                    importantIssueRemoteApplying = true;
                    importantIssueStore = mergeImportantIssueStores(importantIssueStore, remote);`,
          `const remote = snap.val();
                    importantIssueRemoteApplying = true;
                    importantIssueStore = remote && typeof remote === 'object' ? remote : {};`
        );

        html = html.replace(
          `                await importantIssueFirebaseRef.update(importantIssueStore || {});
                updateImportantSharedStatus('Firebase 공유 저장 연결 완료 — 다른 사용자와 체크/이슈 상태가 공유됩니다.', 'success');`,
          `                updateImportantSharedStatus('Firebase 공유 저장 연결 완료 — 다른 사용자와 체크/이슈 상태가 공유됩니다.', 'success');`
        );

        const patchStamp = PATCH_VERSION + '-' + Date.now();
        const patchScripts = '<script src="./detail-contact-patch.js?t=' + patchStamp + '"><\\/script>'
          + '<script src="./ui-polish-patch.js?t=' + patchStamp + '"><\\/script>';

        document.open();
        document.write(html.replace('</body>', patchScripts + '</body>'));
        document.close();
      } catch (error) {
        document.body.innerHTML = '<div class="loading"><strong>대시보드 로딩 실패</strong><div>' + error.message + '</div></div>';
      }
    }
    boot();
  </script>
</body>
</html>
