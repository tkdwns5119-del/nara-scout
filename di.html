<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>싸인텔레콤 DI영업지원</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f8fafc;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #loadMessage {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      color: #475569;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="loadMessage">DI영업지원 대시보드 로딩 중...</div>
  <iframe id="dashboardFrame" src="./di.html" title="DI영업지원 대시보드"></iframe>

  <script>
    const frame = document.getElementById('dashboardFrame');
    const message = document.getElementById('loadMessage');

    function injectScript(doc, src) {
      const script = doc.createElement('script');
      script.src = src + '?t=' + Date.now();
      script.defer = true;
      doc.body.appendChild(script);
    }

    function injectInlineScript(doc, code) {
      const script = doc.createElement('script');
      script.textContent = code;
      doc.body.appendChild(script);
    }

    function injectFullWidthFix(doc) {
      const style = doc.createElement('style');
      style.id = 'di-full-width-fix';
      style.textContent = `
        header > div.max-w-7xl,
        main.max-w-7xl,
        main.flex-grow.max-w-7xl {
          width: 100% !important;
          max-width: none !important;
          margin-left: 0 !important;
          margin-right: 0 !important;
        }
        header > div.max-w-7xl {
          padding-left: 0.75rem !important;
          padding-right: 0.75rem !important;
        }
        main.max-w-7xl,
        main.flex-grow.max-w-7xl {
          padding-left: 0.75rem !important;
          padding-right: 0.75rem !important;
        }
        @media (min-width: 1024px) {
          header > div.max-w-7xl,
          main.max-w-7xl,
          main.flex-grow.max-w-7xl {
            padding-left: 1rem !important;
            padding-right: 1rem !important;
          }
        }
      `;
      doc.head.appendChild(style);
    }

    function injectImportantIssueFirebaseFix(doc) {
      injectInlineScript(doc, `
        (function () {
          async function fixedInitializeImportantIssueSharedStore() {
            try {
              const res = await fetch('./data/workflow-config.json?t=' + Date.now(), { cache: 'no-store' });
              if (!res.ok) {
                updateImportantSharedStatus('공유 저장 설정 파일을 읽지 못했습니다. 현재 브라우저에만 저장됩니다.', 'warn');
                return false;
              }
              const cfg = await res.json();
              if (cfg.provider !== 'firebase') {
                updateImportantSharedStatus('Firebase 설정이 없어 현재 브라우저에만 저장됩니다.', 'warn');
                return false;
              }
              const firebaseConfig = { ...((cfg && cfg.firebaseConfig) || {}) };
              if (!firebaseConfig.apiKey && Array.isArray(firebaseConfig.apiKeyParts)) {
                firebaseConfig.apiKey = firebaseConfig.apiKeyParts.join('');
              }
              delete firebaseConfig.apiKeyParts;
              if (!firebaseConfig.apiKey || String(firebaseConfig.apiKey).startsWith('PASTE_')) {
                updateImportantSharedStatus('Firebase 설정값이 아직 입력되지 않아 현재 브라우저에만 저장됩니다.', 'warn');
                return false;
              }
              await loadExternalScriptOnce('https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js');
              await loadExternalScriptOnce('https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js');
              const appName = 'di-important-issue-store';
              let app;
              try { app = firebase.app(appName); }
              catch { app = firebase.initializeApp(firebaseConfig, appName); }
              const db = firebase.database(app);
              importantIssueFirebaseRef = db.ref(cfg.issuePath || 'importantIssues');
              importantIssueSharedReady = true;
              const snapshot = await importantIssueFirebaseRef.once('value');
              const remoteStore = snapshot.val() || {};
              importantIssueStore = mergeImportantIssueStores(importantIssueStore, remoteStore);
              saveImportantIssueStore({ skipShared: true });
              importantIssueFirebaseRef.on('value', snap => {
                const remote = snap.val() || {};
                importantIssueRemoteApplying = true;
                importantIssueStore = mergeImportantIssueStores(importantIssueStore, remote);
                saveImportantIssueStore({ skipShared: true });
                importantIssueRemoteApplying = false;
                renderBidsTable();
                renderImportantIssueBids();
                updateImportantSharedStatus('Firebase 공유 저장 동기화 완료', 'success');
              });
              await importantIssueFirebaseRef.update(importantIssueStore || {});
              updateImportantSharedStatus('Firebase 공유 저장 연결 완료 — 다른 사용자와 체크/이슈 상태가 공유됩니다.', 'success');
              return true;
            } catch (error) {
              importantIssueSharedReady = false;
              updateImportantSharedStatus('Firebase 공유 저장 연결 실패: ' + error.message, 'error');
              return false;
            }
          }
          window.initializeImportantIssueSharedStore = fixedInitializeImportantIssueSharedStore;
          try { initializeImportantIssueSharedStore = fixedInitializeImportantIssueSharedStore; } catch (error) {}
          setTimeout(fixedInitializeImportantIssueSharedStore, 800);
        })();
      `);
    }

    function injectBidDetailFix(doc) {
      injectInlineScript(doc, `
        (function () {
          function val(x) { return x === undefined || x === null || x === '' ? '-' : String(x); }
          function money(x) {
            try { if (typeof formatKoreanCurrency === 'function') return formatKoreanCurrency(Number(x) || 0); } catch (e) {}
            return (Number(x) || 0).toLocaleString('ko-KR') + '원';
          }
          function contract(item) {
            try { if (typeof getContractMethodLabel === 'function') return getContractMethodLabel(item); } catch (e) {}
            return item.contractMethod || item.contractMethodRaw || item.cntrctMthdNm || '계약방법 미확인';
          }
          function review(item) {
            try {
              if (typeof getImportantState === 'function') {
                var s = getImportantState(item.bidNtceNo);
                var arr = [];
                if (s && s.checked) arr.push('체크 사업');
                if (s && s.issue) arr.push('이슈 검토');
                return arr.length ? arr.join(' / ') : '미검토';
              }
            } catch (e) {}
            return '미검토';
          }
          function card(label, value) {
            return '<div class="bg-slate-50 border border-slate-200 rounded-xl p-3"><div class="text-[10px] text-slate-400 font-semibold mb-1">' + label + '</div><div class="text-xs sm:text-sm font-bold text-slate-800 break-words">' + val(value) + '</div></div>';
          }
          function buildModal() {
            var modal = document.getElementById('aiAssistantModal');
            if (!modal) return null;
            modal.innerHTML = '<div class="bg-white rounded-3xl max-w-6xl w-full max-h-[90vh] overflow-hidden flex flex-col shadow-2xl border border-slate-200 animate-fade-in"><div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50"><div class="flex items-center space-x-2.5"><span class="p-2 bg-cyan-100 text-cyber-cyan rounded-xl"><i data-lucide="file-search" class="w-5 h-5 text-cyber-cyan"></i></span><div><h3 class="font-extrabold text-slate-900 text-sm sm:text-base">사업 기본 상세정보</h3><p class="text-[10px] sm:text-xs text-slate-500">나라장터 수집 데이터 기준 핵심 정보 정리</p></div></div><button onclick="closeAiAssistant()" class="p-2 text-slate-400 hover:text-slate-600 transition rounded-lg hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button></div><div class="flex-grow p-6 overflow-y-auto space-y-5"><div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-4"><div class="flex justify-between items-center gap-3"><span id="detail-service" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border"></span><span id="detail-no" class="text-[10px] text-slate-400 font-mono"></span></div><h4 id="detail-title" class="font-extrabold text-slate-900 text-base sm:text-lg leading-snug"></h4><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3" id="detail-basic"></div></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-4"><div class="bg-white border border-slate-200 rounded-2xl overflow-hidden"><div class="p-4 border-b border-slate-100 bg-slate-50 font-bold text-sm text-slate-900">상세 항목</div><div id="detail-list" class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-3"></div></div><div class="bg-white border border-slate-200 rounded-2xl overflow-hidden"><div class="p-4 border-b border-slate-100 bg-slate-50 font-bold text-sm text-slate-900">검토용 요약</div><div id="detail-summary" class="p-4 text-xs sm:text-sm text-slate-700 leading-relaxed whitespace-pre-line"></div></div></div><div class="flex flex-col sm:flex-row gap-2"><button id="detail-link" class="flex-1 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 text-xs font-bold transition flex items-center justify-center space-x-1.5"><i data-lucide="external-link" class="w-4 h-4"></i><span>나라장터 원본공고 이동</span></button></div></div></div>';
            return modal;
          }
          function showDetail(bidNo) {
            var list = Array.isArray(activeBids) ? activeBids : [];
            var item = list.find(function (b) { return b.bidNtceNo === bidNo; });
            if (!item) return;
            var modal = buildModal();
            if (!modal) return;
            var type = item.serviceType || '-';
            var cls = 'border-cyan-200 bg-cyan-50 text-cyber-cyan';
            if (type === '사전규격') cls = 'border-fuchsia-200 bg-fuchsia-50 text-cyber-fuchsia';
            if (type === '발주계획') cls = 'border-amber-200 bg-amber-50 text-cyber-amber';
            var c = contract(item);
            var b = money(item.assignBudgetAmt);
            var closeLabel = type === '공고' ? '마감일' : (type === '사전규격' ? '의견종료' : '예정월');
            var summary = '[사업 검토 요약]\n- 사업명: ' + val(item.bidNtceNm) + '\n- 유형/번호: ' + type + ' / ' + val(item.bidNtceNo) + '\n- 계약방법: ' + c + '\n- 공고기관: ' + val(item.ntceInsttNm) + '\n- 수요기관: ' + val(item.dminsttNm) + '\n- 지역: ' + val(item.region) + '\n- 예산: ' + b + '\n- 등록일: ' + val(item.bidNtceRegistDt) + '\n- ' + closeLabel + ': ' + val(item.bidClseDt) + '\n- 검토상태: ' + review(item);
            document.getElementById('detail-service').innerText = type;
            document.getElementById('detail-service').className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold border ' + cls;
            document.getElementById('detail-no').innerText = val(item.bidNtceNo);
            document.getElementById('detail-title').innerText = val(item.bidNtceNm);
            document.getElementById('detail-basic').innerHTML = card('공고기관', item.ntceInsttNm) + card('수요기관', item.dminsttNm) + card('지역', item.region) + card('배정 예산', b);
            document.getElementById('detail-list').innerHTML = card('계약방법', c) + card('키워드', item.searchKeyword) + card('등록일', item.bidNtceRegistDt) + card(closeLabel, item.bidClseDt) + card('검토상태', review(item)) + card('원본 URL', item.g2bUrl || 'https://www.g2b.go.kr');
            document.getElementById('detail-summary').innerText = summary;
            document.getElementById('detail-link').onclick = function () { openBidLink(item.g2bUrl || 'https://www.g2b.go.kr'); };
            modal.classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
          }
          function decorateButtons() {
            document.querySelectorAll('button[onclick*="openAiAssistant"]').forEach(function (btn) {
              btn.title = '상세보기';
              btn.className = 'px-2.5 py-2 bg-cyan-50 hover:bg-cyan-100 text-cyber-cyan rounded-lg border border-cyan-200 transition inline-flex items-center gap-1';
              btn.innerHTML = '<i data-lucide="file-search" class="w-3.5 h-3.5"></i><span class="text-[10px] font-bold">상세</span>';
            });
            if (window.lucide) lucide.createIcons();
          }
          window.openBidDetail = showDetail;
          window.openAiAssistant = showDetail;
          window.closeAiAssistant = function () { var modal = document.getElementById('aiAssistantModal'); if (modal) modal.classList.add('hidden'); };
          try { openAiAssistant = showDetail; } catch (e) {}
          try { closeAiAssistant = window.closeAiAssistant; } catch (e) {}
          var oldRender = window.renderBidsTable;
          if (typeof oldRender === 'function') {
            window.renderBidsTable = function (list) { oldRender(list); setTimeout(decorateButtons, 0); };
            try { renderBidsTable = window.renderBidsTable; } catch (e) {}
          }
          setTimeout(decorateButtons, 300);
          setTimeout(decorateButtons, 1200);
          setInterval(decorateButtons, 2500);
        })();
      `);
    }

    frame.addEventListener('load', () => {
      message.style.display = 'none';
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        injectFullWidthFix(doc);
        injectImportantIssueFirebaseFix(doc);
        injectBidDetailFix(doc);
        injectScript(doc, './firebase-workflow-adapter.js');
      } catch (error) {
        console.error('Dashboard injection failed:', error);
      }
    });
  </script>
</body>
</html>
