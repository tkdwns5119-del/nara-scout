    function updateReview(id, patch) {
      const current = normalizeReview(state.reviews[id]);
      const next = { ...current, ...patch, updatedAt: new Date().toISOString() };
      if (patch.status) {
        next.checked = patch.status === "checked";
        next.issue = patch.status === "issue";
        next.done = patch.status === "done";
      }
      if (Object.hasOwn(patch, "note")) {
        const noteKey = { checked: "checkedNote", issue: "issueNote", done: "doneNote" }[next.status];
        if (noteKey) next[noteKey] = patch.note;
      }
      state.reviews[id] = next;
      saveReviews();
    }

    function populateFilters() {
      const contracts = [...new Set(state.bids
        .filter((item) => item.serviceType !== "사전규격")
        .map((item) => safe(item.contractMethod, "").split(" / ")[0])
        .filter((value) => value && value !== "사전규격"))].sort((a, b) => a.localeCompare(b, "ko"));
      const regions = [...new Set(state.bids.map((item) => item.region).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko"));
      const monthCounts = new Map();
      state.bids.filter((item) => !item._scope.excluded).forEach((item) => {
        const month = registrationMonth(item);
        if (month) monthCounts.set(month, (monthCounts.get(month) || 0) + 1);
      });
      state.archiveMonths.forEach((entry) => {
        if (entry?.month) monthCounts.set(entry.month, Math.max(monthCounts.get(entry.month) || 0, Number(entry.totalCount || 0)));
      });
      const now = new Date();
      const registeredMonths = Array.from({ length: 12 }, (_, index) => {
        const date = new Date(now.getFullYear(), now.getMonth() - index, 1);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
      });
      const visibleKeywordGroups = KEYWORD_GROUPS.filter((group) => !group.hidden);
      const keywordSections = [...new Set(visibleKeywordGroups.map((group) => group.section))];
      const keywordOptions = keywordSections.map((section) => {
        const options = visibleKeywordGroups.filter((group) => group.section === section).map((group) => {
          const count = state.bids.filter((item) => item._active && !item._scope.excluded && matchesKeywordGroup(item, group.id)).length;
          return `<option value="${group.id}">${escapeHtml(group.label)} (${count})</option>`;
        }).join("");
        return `<optgroup label="${escapeHtml(section)}">${options}</optgroup>`;
      }).join("");
      const workOptions = WORK_GROUPS.map((group) => {
        const count = state.bids.filter((item) => item._active && !item._scope.excluded && item._keyword.works.includes(group.id)).length;
        return `<option value="${group.id}">${escapeHtml(group.label)} (${count})</option>`;
      }).join("");
      $("#contractFilter").innerHTML = `<option value="">전체 계약방법</option>${contracts.map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("")}`;
      $("#regionFilter").innerHTML = `<option value="">지역</option>${regions.map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("")}`;
      $("#keywordFilter").innerHTML = `<option value="">전체 키워드 분류</option>${keywordOptions}`;
      $("#workFilter").innerHTML = `<option value="">전체 업무 유형</option>${workOptions}`;
      $("#registeredFilter").innerHTML = `
        <option value="">전체 등록월</option>
        <option value="today">오늘 등록</option>
        <option value="last3">최근 3일</option>
        <option value="last7">최근 7일</option>
        <optgroup label="월별 등록">${registeredMonths.map((value) => `<option value="month:${value}">${Number(value.slice(0, 4))}년 ${Number(value.slice(5))}월 (${monthCounts.get(value) || 0}건)</option>`).join("")}</optgroup>`;
    }

    function setView(view) {
      state.view = view;
      $$(".view-tab").forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.view === view);
        tab.setAttribute("aria-pressed", String(tab.dataset.view === view));
      });
      renderRows();
    }

    // 값이 들어간 필터는 강조하고, 접힌 '필터 더보기' 안에 걸린 필터 수를 버튼에 표시한다.
    const MORE_FILTER_KEYS = ["registered", "business", "contract", "keyword", "work"];
    const FILTER_SELECTS = { registered: "#registeredFilter", service: "#serviceFilter", business: "#businessFilter", contract: "#contractFilter", budget: "#budgetFilter", region: "#regionFilter", keyword: "#keywordFilter", work: "#workFilter" };

    function updateFilterIndicators() {
      Object.entries(FILTER_SELECTS).forEach(([key, selector]) => $(selector).classList.toggle("is-set", Boolean(state.filters[key])));
      const hiddenCount = MORE_FILTER_KEYS.filter((key) => state.filters[key]).length;
      $("#moreFilterCount").hidden = hiddenCount === 0;
      $("#moreFilterCount").textContent = hiddenCount;
    }

    function toggleMoreFilters(open = $("#moreFilters").hidden) {
      $("#moreFilters").hidden = !open;
      $("#moreFiltersBtn").setAttribute("aria-expanded", String(open));
    }

    function resetFilters() {
      state.filters = { search: "", registered: "", service: "", business: "", contract: "", budget: "", region: "", keyword: "", work: "" };
      $("#searchInput").value = "";
      $("#registeredFilter").value = "";
      $("#serviceFilter").value = "";
      $("#businessFilter").value = "";
      $("#contractFilter").value = "";
      $("#budgetFilter").value = "";
      $("#regionFilter").value = "";
      $("#keywordFilter").value = "";
      $("#workFilter").value = "";
      updateFilterIndicators();
      renderRows();
      showToast("검색어와 필터를 모두 지웠습니다.");
    }

    function showToast(message) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function refreshIcons() {
      if (window.lucide) window.lucide.createIcons();
    }

    async function loadArchiveIndex() {
      try {
        const response = await fetch(`./data/archive/index.json?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) return [];
        const data = await response.json();
        return Array.isArray(data.months) ? data.months : [];
      } catch {
        return [];
      }
    }

    async function loadArchiveMonth(month) {
      if (!month || state.loadedArchiveMonths.has(month)) return;
      state.loadedArchiveMonths.add(month);
      const known = state.archiveMonths.some((entry) => entry?.month === month && Number(entry.totalCount || 0) > 0);
      if (!known) return;
      try {
        const response = await fetch(`./data/archive/${encodeURIComponent(month)}.json?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const archived = Array.isArray(data.bids) ? data.bids : [];
        state.bids = dedupe([...state.bids, ...archived]).map(enrich);
        migrateReviewsForBids();
      } catch (error) {
        state.loadedArchiveMonths.delete(month);
        console.warn(`${month} 월별 데이터 불러오기 실패`, error);
        showToast("월별 데이터를 불러오지 못했습니다.");
      }
    }

    function bindControls() {
      $("#viewTabs").addEventListener("click", (event) => {
        const tab = event.target.closest("[data-view]");
        if (tab) setView(tab.dataset.view);
      });
      $("#searchInput").addEventListener("input", (event) => { state.filters.search = event.target.value.trim(); renderRows(); });
      Object.entries(FILTER_SELECTS).forEach(([key, selector]) => {
        $(selector).addEventListener("change", async (event) => {
          state.filters[key] = event.target.value;
          updateFilterIndicators();
          if (key === "registered" && state.filters.registered.startsWith("month:")) {
            await loadArchiveMonth(state.filters.registered.slice(6));
          }
          renderRows();
        });
      });
      $("#moreFiltersBtn").addEventListener("click", () => toggleMoreFilters());
      $("#resetBtn").addEventListener("click", resetFilters);
      $("#emptyResetBtn").addEventListener("click", resetFilters);
      $("#reloadBtn").addEventListener("click", loadData);
      $("#authBtn").addEventListener("click", toggleReviewLogin);
      $("#authUidBtn").addEventListener("click", copyReviewUid);
      window.addEventListener("keydown", (event) => { if (event.key === "Escape") $("#detailPane").classList.remove("open"); });
    }

    async function loadData() {
      $("#reloadBtn").disabled = true;
      $("#syncPill").className = "sync-pill";
      $("#syncText").textContent = "데이터 불러오는 중";
      try {
        const response = await fetch(`./data/bids.json?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        state.meta = data;
        state.bids = dedupe(Array.isArray(data.bids) ? data.bids : []).map(enrich);
        state.archiveMonths = await loadArchiveIndex();
        state.loadedArchiveMonths = new Set();
        migrateReviewsForBids();
        populateFilters();
        renderMetrics();
        if (state.selectedId && !state.bids.some((item) => item.bidId === state.selectedId)) state.selectedId = "";
        if (!state.selectedId) state.selectedId = visibleBids()[0]?.bidId || "";
        renderRows();
        renderDetail();
        const ageHours = (Date.now() - new Date(data.generatedAt).getTime()) / 3600000;
        const stale = !(ageHours < STALE_DATA_HOURS);
        $("#syncPill").className = data.failedCalls > 0 ? "sync-pill error" : stale ? "sync-pill warn" : "sync-pill ok";
        $("#syncPill").title = stale ? `마지막 수집 후 ${STALE_DATA_HOURS}시간 이상 지났습니다. GitHub Actions 실행 상태를 확인해 주세요.` : "";
        $("#syncText").textContent = `${formatGenerated(data.generatedAt)} · ${stale ? "갱신 지연" : `${data.failedCalls || 0}건 오류`}`;
      } catch (error) {
        console.error(error);
        $("#loadingState").hidden = false;
        $("#loadingState").innerHTML = `<div><strong style="display:block;color:var(--red);margin-bottom:6px">데이터를 불러오지 못했습니다.</strong>로컬 서버에서 페이지를 열었는지 확인해 주세요.</div>`;
        $("#bidTable").hidden = true;
        $("#syncPill").className = "sync-pill error";
        $("#syncText").textContent = "데이터 연결 오류";
      } finally {
        $("#reloadBtn").disabled = false;
        refreshIcons();
      }
    }

    bindControls();
    loadData().then(initializeReviewSync);
    window.addEventListener("load", refreshIcons);
  </script>
</body>
</html>
