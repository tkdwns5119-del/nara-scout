<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DI 조달 액션보드</title>
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --panel-strong: #eef4f8;
      --line: #d9e2ec;
      --line-soft: #edf1f5;
      --line-strong: #b8c4d2;
      --text: #172033;
      --muted: #64748b;
      --blue: #0b7891;
      --green: #087f5b;
      --red: #c22f52;
      --orange: #b76a00;
      --purple: #7c3aed;
      --radius: 8px;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 8px 24px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }

    button, input, select, textarea {
      font: inherit;
      border-radius: 6px;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }

    button:hover { border-color: var(--line-strong); background: #f8fbfd; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid rgba(11, 120, 145, 0.24);
      outline-offset: 2px;
    }
    button.active { border-color: #96d4df; background: #e8f7fa; color: var(--blue); font-weight: 800; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 12px rgba(15, 23, 42, 0.04);
      backdrop-filter: blur(10px);
    }

    .topbar {
      min-height: 64px;
      padding: 12px 18px;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 16px;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: #102a43;
      color: #fff;
      border-radius: var(--radius);
      flex: 0 0 auto;
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.16);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-btn {
      min-height: 34px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .layout {
      padding: 16px 18px 22px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(420px, 460px);
      gap: 18px;
      align-items: start;
    }

    .main {
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 10px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 13px 14px;
      min-height: 84px;
      box-shadow: var(--shadow);
    }

    .metric-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric-value {
      margin-top: 9px;
      font-size: 24px;
      line-height: 1.05;
      font-weight: 900;
      color: var(--text);
    }

    .metric-sub {
      margin-top: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .panel-head {
      min-height: 46px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #fbfdff;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .panel-title span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .priority-head-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .mode-switch {
      display: inline-grid;
      grid-template-columns: repeat(2, minmax(0, auto));
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f3f6fa;
    }

    .mode-button {
      min-height: 30px;
      padding: 0 9px;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .mode-button:hover { border-color: transparent; }

    .mode-button.active {
      border-color: transparent;
      background: #fff;
      color: var(--blue);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
    }

    .mode-button svg {
      width: 14px;
      height: 14px;
    }

    .mode-count {
      min-width: 20px;
      padding: 1px 5px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #475569;
      font-size: 10px;
      text-align: center;
    }

    .mode-button.active .mode-count {
      background: #d9f1f5;
      color: var(--blue);
    }

    .priority-list {
      display: grid;
      grid-template-columns: repeat(5, minmax(170px, 1fr));
      gap: 10px;
      padding: 12px;
      overflow-x: auto;
    }

    .priority-card {
      min-height: 132px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: var(--radius);
      padding: 11px;
      text-align: left;
      display: grid;
      gap: 8px;
      align-content: start;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    .priority-card:hover {
      border-color: #a8c3d1;
      background: #fbfdff;
    }

    .priority-card.selected {
      border-color: #80c7d5;
      box-shadow: inset 3px 0 0 var(--blue);
    }

    .toolbar {
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(520px, auto);
      gap: 10px;
      border-bottom: 1px solid var(--line);
      background: #fbfdff;
    }

    .list-mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .list-mode-switch .mode-button {
      min-height: 34px;
      padding: 0 12px;
    }

    .date-filter {
      min-height: 40px;
      padding: 0 8px 0 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .date-filter.active {
      border-color: #96d4df;
      background: #e8f7fa;
      color: var(--blue);
    }

    .date-filter svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .date-filter select {
      min-width: 170px;
      min-height: 36px;
      padding: 0 24px 0 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font-size: 11px;
      font-weight: 800;
    }

    .search {
      position: relative;
    }

    .search svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #8091a7;
      width: 16px;
      height: 16px;
    }

    input[type="search"] {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      padding: 0 12px 0 34px;
      outline: none;
      color: var(--text);
      background: #fff;
    }

    input[type="search"]:focus {
      border-color: #80c7d5;
      box-shadow: 0 0 0 3px rgba(11, 120, 145, 0.12);
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(5, minmax(118px, auto));
      gap: 6px;
      justify-content: flex-end;
    }

    .filters select {
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: #475569;
      outline: none;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
    }

    .filters select:hover {
      border-color: var(--line-strong);
    }

    .filters select:focus {
      border-color: #80c7d5;
      box-shadow: 0 0 0 3px rgba(11, 120, 145, 0.12);
    }

    .filters select:first-child {
      border-color: #b9e3ea;
      background: #e8f7fa;
      color: var(--blue);
    }

    .result-meta {
      grid-column: 1 / -1;
      min-height: 20px;
      color: var(--muted);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      padding: 12px 12px;
      border-bottom: 1px solid var(--line-soft);
      vertical-align: top;
      font-size: 12px;
    }

    th {
      background: var(--panel-strong);
      color: #354052;
      text-align: left;
      font-size: 11px;
      font-weight: 900;
    }

    tr {
      background: #fff;
      cursor: pointer;
    }

    tbody td {
      min-height: 66px;
    }

    tbody tr:hover { background: #f8fbfd; }
    tbody tr.selected {
      background: #eaf7fa;
      box-shadow: inset 3px 0 0 var(--blue);
    }

    .title-cell {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .title-main {
      font-weight: 800;
      color: #111827;
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .business-title-row {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      min-width: 0;
    }

    .business-title-row .title-main { min-width: 0; }

    .contract-prefix {
      flex: 0 0 auto;
      max-width: 126px;
      min-height: 20px;
      padding: 0 6px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      background: #f3f6fa;
      color: #475569;
      font-size: 10px;
      font-weight: 800;
      line-height: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .title-sub {
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .published-date {
      color: #475569;
      font-weight: 700;
    }

    .today-marker {
      display: inline-flex;
      align-items: center;
      min-height: 18px;
      margin-right: 5px;
      padding: 0 5px;
      border: 1px solid #a8ddc2;
      border-radius: 4px;
      background: #e8f7ef;
      color: var(--green);
      font-size: 9px;
      font-weight: 900;
      vertical-align: 1px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.bid { color: var(--blue); background: #e8f7fa; border-color: #b9e3ea; }
    .badge.spec { color: var(--purple); background: #f1ecff; border-color: #d8c9ff; }
    .badge.plan { color: var(--orange); background: #fff4df; border-color: #f0d09c; }
    .badge.red { color: var(--red); background: #fff0f3; border-color: #f2b8c5; }
    .badge.green { color: var(--green); background: #e8f7ef; border-color: #a8ddc2; }
    .badge.gray { color: #475569; background: #f3f6fa; border-color: #dbe3ec; }

    .money {
      font-weight: 900;
      color: #111827;
      white-space: nowrap;
    }

    .dday {
      font-weight: 900;
      white-space: nowrap;
    }

    .dday.red { color: var(--red); }
    .dday.orange { color: var(--orange); }
    .dday.gray { color: var(--muted); }

    .side {
      position: sticky;
      top: 82px;
      scroll-margin-top: 82px;
      display: grid;
      gap: 12px;
    }

    .side-panel {
      overflow: hidden;
      max-height: calc(100vh - 98px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .side-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--line);
      background: #fbfdff;
    }

    .side-tab {
      min-height: 48px;
      padding: 7px 10px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .side-tab:last-child {
      border-right: 0;
    }

    .side-tab.active {
      background: #e8f7fa;
      color: var(--blue);
      box-shadow: inset 0 -3px 0 var(--blue);
    }

    .side-tab-meta {
      font-size: 10px;
      color: inherit;
      opacity: 0.82;
      font-weight: 800;
    }

    .side-pane {
      min-height: 0;
      overflow: auto;
    }

    .side-pane[hidden] {
      display: none;
    }

    .detail-body {
      padding: 16px;
      display: grid;
      gap: 16px;
    }

    .detail-title {
      margin: 0;
      font-size: 17px;
      line-height: 1.5;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
    }

    .field {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 11px 12px;
      background: var(--panel-soft);
      min-width: 0;
    }

    .field-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .field-value {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .detail-actions button, .detail-link {
      min-height: 40px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      border: 1px solid var(--line);
      color: var(--text);
      background: #fff;
      border-radius: 6px;
    }

    .detail-actions button.active {
      border-color: #80c7d5;
      background: #e8f7fa;
      color: var(--blue);
    }

    .detail-actions button.active.issue {
      border-color: #f2b8c5;
      background: #fff0f3;
      color: var(--red);
    }

    .detail-actions button.active.done {
      border-color: #cbd5e1;
      background: #f3f6fa;
      color: #475569;
    }

    .review-board {
      padding: 10px;
      display: grid;
      gap: 10px;
    }

    .status-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }

    .status-card-head {
      min-height: 34px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #edf1f5;
      font-size: 12px;
      font-weight: 900;
    }

    .status-list {
      max-height: 184px;
      overflow: auto;
    }

    .status-item {
      width: 100%;
      padding: 9px 10px;
      border: 0;
      border-bottom: 1px solid #edf1f5;
      background: #fff;
      text-align: left;
      display: grid;
      gap: 5px;
      cursor: pointer;
    }

    .status-item:hover,
    .status-item.selected {
      background: #f8fbfd;
    }

    .status-item.selected {
      box-shadow: inset 3px 0 0 var(--blue);
    }

    .status-item-title {
      font-size: 12px;
      line-height: 1.35;
      font-weight: 800;
      color: #111827;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .status-item-note {
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .status-empty {
      padding: 14px 10px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .note-grid {
      display: grid;
      gap: 8px;
    }

    .note-empty {
      padding: 12px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      background: #fbfdff;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }

    .note-field {
      display: grid;
      gap: 7px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-soft);
    }

    .note-field.active {
      border-color: #b9e3ea;
      background: #f4fbfd;
    }

    .note-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .note-field textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px;
      color: var(--text);
      background: #fff;
      font: inherit;
      font-size: 12px;
      line-height: 1.5;
      outline: none;
    }

    .note-field textarea:focus {
      border-color: #80c7d5;
      box-shadow: 0 0 0 3px rgba(11, 120, 145, 0.12);
    }

    .detail-link.primary {
      grid-column: 1 / -1;
      background: #0b7891;
      border-color: #0b7891;
      color: #fff;
    }

    .empty {
      padding: 34px 16px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 1180px) {
      .layout { grid-template-columns: 1fr; }
      .side { position: static; }
      .side-panel { max-height: none; }
      .side-pane { overflow: visible; }
    }

    @media (max-width: 760px) {
      .topbar { grid-template-columns: 1fr; }
      .top-actions { justify-content: flex-start; }
      .layout { padding: 10px; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .panel-head { align-items: flex-start; flex-direction: column; }
      .priority-head-actions { width: 100%; justify-content: space-between; }
      .mode-switch { flex: 1 1 auto; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .list-mode-row { align-items: stretch; flex-direction: column; }
      .list-mode-switch { width: 100%; }
      .date-filter { width: 100%; }
      .date-filter select { min-width: 0; width: 100%; }
      .toolbar { grid-template-columns: 1fr; }
      .filters {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        justify-content: stretch;
      }

      .result-meta {
        justify-content: flex-start;
      }
      .priority-list { grid-template-columns: repeat(5, 78vw); }
      table { min-width: 860px; }
      .table-wrap { overflow-x: auto; }
      .field-grid { grid-template-columns: 1fr; }
    }
  </style>
<style id="production-ui-polish">
  :root {
    --bg: #f3f6f9;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 6px 18px rgba(15, 23, 42, 0.035);
  }

  .metric-label svg {
    width: 18px;
    height: 18px;
    color: #53657a;
    stroke-width: 1.8;
  }

  .priority-list {
    scrollbar-width: thin;
    scrollbar-color: #aebbc8 transparent;
  }

  .priority-list::-webkit-scrollbar { height: 7px; }
  .priority-list::-webkit-scrollbar-track { background: transparent; }
  .priority-list::-webkit-scrollbar-thumb { background: #aebbc8; border-radius: 999px; }

  .toolbar {
    grid-template-columns: minmax(0, 1fr);
    gap: 9px;
  }

  input[type="search"] { min-height: 40px; }

  .filters {
