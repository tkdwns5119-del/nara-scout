<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DI 조달 액션보드</title>
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --panel-strong: #eef4f8;
      --line: #d9e2ec;
      --line-soft: #edf1f5;
      --line-strong: #b8c4d2;
      --text: #172033;
      --muted: #64748b;
      --blue: #0b7891;
      --green: #087f5b;
      --red: #c22f52;
      --orange: #b76a00;
      --purple: #7c3aed;
      --radius: 8px;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 8px 24px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }

    button, input, select, textarea {
      font: inherit;
      border-radius: 6px;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }

    button:hover { border-color: var(--line-strong); background: #f8fbfd; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid rgba(11, 120, 145, 0.24);
      outline-offset: 2px;
    }
    button.active { border-color: #96d4df; background: #e8f7fa; color: var(--blue); font-weight: 800; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 12px rgba(15, 23, 42, 0.04);
      backdrop-filter: blur(10px);
    }

    .topbar {
      min-height: 64px;
      padding: 12px 18px;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 16px;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: #102a43;
      color: #fff;
      border-radius: var(--radius);
      flex: 0 0 auto;
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.16);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-btn {
      min-height: 34px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .layout {
      padding: 16px 18px 22px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(420px, 460px);
      gap: 18px;
      align-items: start;
    }

    .main {
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 10px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 13px 14px;
      min-height: 84px;
      box-shadow: var(--shadow);
    }

    .metric-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric-value {
      margin-top: 9px;
      font-size: 24px;
      line-height: 1.05;
      font-weight: 900;
      color: var(--text);
    }

    .metric-sub {
      margin-top: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .panel-head {
      min-height: 46px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #fbfdff;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .panel-title span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .priority-head-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .mode-switch {
      display: inline-grid;
      grid-template-columns: repeat(2, minmax(0, auto));
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f3f6fa;
    }

    .mode-button {
      min-height: 30px;
      padding: 0 9px;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .mode-button:hover { border-color: transparent; }

    .mode-button.active {
      border-color: transparent;
      background: #fff;
      color: var(--blue);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
    }

    .mode-button svg {
      width: 14px;
      height: 14px;
    }

    .mode-count {
      min-width: 20px;
      padding: 1px 5px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #475569;
      font-size: 10px;
      text-align: center;
    }

    .mode-button.active .mode-count {
      background: #d9f1f5;
      color: var(--blue);
    }

    .priority-list {
      display: grid;
      grid-template-columns: repeat(5, minmax(170px, 1fr));
      gap: 10px;
      padding: 12px;
      overflow-x: auto;
    }

    .priority-card {
      min-height: 132px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: var(--radius);
      padding: 11px;
      text-align: left;
      display: grid;
      gap: 8px;
      align-content: start;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    .priority-card:hover {
      border-color: #a8c3d1;
      background: #fbfdff;
    }

    .priority-card.selected {
      border-color: #80c7d5;
      box-shadow: inset 3px 0 0 var(--blue);
    }

    .toolbar {
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(520px, auto);
      gap: 10px;
      border-bottom: 1px solid var(--line);
      background: #fbfdff;
    }

    .list-mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .list-mode-switch .mode-button {
      min-height: 34px;
      padding: 0 12px;
    }

    .date-filter {
      min-height: 40px;
      padding: 0 8px 0 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .date-filter.active {
      border-color: #96d4df;
      background: #e8f7fa;
      color: var(--blue);
    }

    .date-filter svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .date-filter select {
      min-width: 170px;
      min-height: 36px;
      padding: 0 24px 0 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font-size: 11px;
      font-weight: 800;
    }

    .search {
      position: relative;
    }

    .search svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #8091a7;
      width: 16px;
      height: 16px;
    }

    input[type="search"] {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      padding: 0 12px 0 34px;
      outline: none;
      color: var(--text);
      background: #fff;
    }

    input[type="search"]:focus {
      border-color: #80c7d5;
      box-shadow: 0 0 0 3px rgba(11, 120, 145, 0.12);
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(5, minmax(118px, auto));
      gap: 6px;
      justify-content: flex-end;
    }

    .filters select {
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: #475569;
      outline: none;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
    }

    .filters select:hover {
      border-color: var(--line-strong);
    }

    .filters select:focus {
      border-color: #80c7d5;
      box-shadow: 0 0 0 3px rgba(11, 120, 145, 0.12);
    }

    .filters select:first-child {
      border-color: #b9e3ea;
      background: #e8f7fa;
      color: var(--blue);
    }

    .result-meta {
      grid-column: 1 / -1;
      min-height: 20px;
      color: var(--muted);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      padding: 12px 12px;
      border-bottom: 1px solid var(--line-soft);
      vertical-align: top;
      font-size: 12px;
    }

    th {
      background: var(--panel-strong);
      color: #354052;
      text-align: left;
      font-size: 11px;
      font-weight: 900;
    }

    tr {
      background: #fff;
      cursor: pointer;
    }

    tbody td {
      min-height: 66px;
    }

    tbody tr:hover { background: #f8fbfd; }
    tbody tr.selected {
      background: #eaf7fa;
      box-shadow: inset 3px 0 0 var(--blue);
    }

    .title-cell {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .title-main {
      font-weight: 800;
      color: #111827;
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .business-title-row {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      min-width: 0;
    }

    .business-title-row .title-main { min-width: 0; }

    .contract-prefix {
      flex: 0 0 auto;
      max-width: 126px;
      min-height: 20px;
      padding: 0 6px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      background: #f3f6fa;
      color: #475569;
      font-size: 10px;
      font-weight: 800;
      line-height: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .title-sub {
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .published-date {
      color: #475569;
      font-weight: 700;
    }

    .today-marker {
      display: inline-flex;
      align-items: center;
      min-height: 18px;
      margin-right: 5px;
      padding: 0 5px;
      border: 1px solid #a8ddc2;
      border-radius: 4px;
      background: #e8f7ef;
      color: var(--green);
      font-size: 9px;
      font-weight: 900;
      vertical-align: 1px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.bid { color: var(--blue); background: #e8f7fa; border-color: #b9e3ea; }
    .badge.spec { color: var(--purple); background: #f1ecff; border-color: #d8c9ff; }
    .badge.plan { color: var(--orange); background: #fff4df; border-color: #f0d09c; }
    .badge.red { color: var(--red); background: #fff0f3; border-color: #f2b8c5; }
    .badge.green { color: var(--green); background: #e8f7ef; border-color: #a8ddc2; }
    .badge.gray { color: #475569; background: #f3f6fa; border-color: #dbe3ec; }

    .money {
      font-weight: 900;
      color: #111827;
      white-space: nowrap;
    }

    .dday {
      font-weight: 900;
      white-space: nowrap;
    }

    .dday.red { color: var(--red); }
    .dday.orange { color: var(--orange); }
    .dday.gray { color: var(--muted); }

    .side {
      position: sticky;
      top: 82px;
      display: grid;
      gap: 12px;
    }

    .side-panel {
      overflow: hidden;
      max-height: calc(100vh - 98px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .side-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--line);
      background: #fbfdff;
    }

    .side-tab {
      min-height: 48px;
      padding: 7px 10px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .side-tab:last-child {
      border-right: 0;
    }

    .side-tab.active {
      background: #e8f7fa;
      color: var(--blue);
      box-shadow: inset 0 -3px 0 var(--blue);
    }

    .side-tab-meta {
      font-size: 10px;
      color: inherit;
      opacity: 0.82;
      font-weight: 800;
    }

    .side-pane {
      min-height: 0;
      overflow: auto;
    }

    .side-pane[hidden] {
      display: none;
    }

    .detail-body {
      padding: 16px;
      display: grid;
      gap: 16px;
    }

    .detail-title {
      margin: 0;
      font-size: 17px;
      line-height: 1.5;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
    }

    .field {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 11px 12px;
      background: var(--panel-soft);
      min-width: 0;
    }

    .field-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .field-value {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .detail-actions button, .detail-link {
      min-height: 40px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      border: 1px solid var(--line);
      color: var(--text);
      background: #fff;
      border-radius: 6px;
    }

    .detail-actions button.active {
      border-color: #80c7d5;
      background: #e8f7fa;
      color: var(--blue);
    }

    .detail-actions button.active.issue {
      border-color: #f2b8c5;
      background: #fff0f3;
      color: var(--red);
    }

    .detail-actions button.active.done {
      border-color: #cbd5e1;
      background: #f3f6fa;
      color: #475569;
    }

    .review-board {
      padding: 10px;
      display: grid;
      gap: 10px;
    }

    .status-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }

    .status-card-head {
      min-height: 34px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #edf1f5;
      font-size: 12px;
      font-weight: 900;
    }

    .status-list {
      max-height: 184px;
      overflow: auto;
    }

    .status-item {
      width: 100%;
      padding: 9px 10px;
      border: 0;
      border-bottom: 1px solid #edf1f5;
      background: #fff;
      text-align: left;
      display: grid;
      gap: 5px;
      cursor: pointer;
    }

    .status-item:hover,
    .status-item.selected {
      background: #f8fbfd;
    }

    .status-item.selected {
      box-shadow: inset 3px 0 0 var(--blue);
    }

    .status-item-title {
      font-size: 12px;
      line-height: 1.35;
      font-weight: 800;
      color: #111827;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .status-item-note {
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .status-empty {
      padding: 14px 10px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .note-grid {
      display: grid;
      gap: 8px;
    }

    .note-empty {
      padding: 12px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      background: #fbfdff;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }

    .note-field {
      display: grid;
      gap: 7px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-soft);
    }

    .note-field.active {
      border-color: #b9e3ea;
      background: #f4fbfd;
    }

    .note-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .note-field textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px;
      color: var(--text);
      background: #fff;
      font: inherit;
      font-size: 12px;
      line-height: 1.5;
      outline: none;
    }

    .note-field textarea:focus {
      border-color: #80c7d5;
      box-shadow: 0 0 0 3px rgba(11, 120, 145, 0.12);
    }

    .detail-link.primary {
      grid-column: 1 / -1;
      background: #0b7891;
      border-color: #0b7891;
      color: #fff;
    }

    .empty {
      padding: 34px 16px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 1180px) {
      .layout { grid-template-columns: 1fr; }
      .side { position: static; }
      .side-panel { max-height: none; }
      .side-pane { overflow: visible; }
    }

    @media (max-width: 760px) {
      .topbar { grid-template-columns: 1fr; }
      .top-actions { justify-content: flex-start; }
      .layout { padding: 10px; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .panel-head { align-items: flex-start; flex-direction: column; }
      .priority-head-actions { width: 100%; justify-content: space-between; }
      .mode-switch { flex: 1 1 auto; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .list-mode-row { align-items: stretch; flex-direction: column; }
      .list-mode-switch { width: 100%; }
      .date-filter { width: 100%; }
      .date-filter select { min-width: 0; width: 100%; }
      .toolbar { grid-template-columns: 1fr; }
      .filters {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        justify-content: stretch;
      }

      .result-meta {
        justify-content: flex-start;
      }
      .priority-list { grid-template-columns: repeat(5, 78vw); }
      table { min-width: 860px; }
      .table-wrap { overflow-x: auto; }
      .field-grid { grid-template-columns: 1fr; }
    }
  </style>
<style id="production-ui-polish">
  :root {
    --bg: #f3f6f9;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 6px 18px rgba(15, 23, 42, 0.035);
  }

  .metric-label svg {
    width: 18px;
    height: 18px;
    color: #53657a;
    stroke-width: 1.8;
  }

  .priority-list {
    scrollbar-width: thin;
    scrollbar-color: #aebbc8 transparent;
  }

  .priority-list::-webkit-scrollbar { height: 7px; }
  .priority-list::-webkit-scrollbar-track { background: transparent; }
  .priority-list::-webkit-scrollbar-thumb { background: #aebbc8; border-radius: 999px; }

  .toolbar {
    grid-template-columns: minmax(0, 1fr);
    gap: 9px;
  }

  input[type="search"] { min-height: 40px; }

  .filters {

    const REVIEW_SYNC_APP = "di-actionboard-review";

    const createIcons = () => {

    window.addEventListener("load", createIcons);

    const parseDate = (value) => {

    const typeClass = (item) => {

    const uniqueBy = (items, getKey) => {

      if (!previous) return { previous: null, labels: [], keys: new Set() };
      const fields = [

      ];
      const changed = fields.filter((fieldInfo) => fieldInfo.get(item) !== fieldInfo.get(previous));

    const normalizedBusinessTitle = (value) => safe(value, "")

          return titleKey && normalizedBusinessTitle(candidate.bidNtceNm) === titleKey

    const isWithinDays = (item, days) => {

      const action = changedKey === "favorite"
        ? (isActive ? "\uAD00\uC2EC \uC0AC\uC5C5 \uC124\uC815" : "\uAD00\uC2EC \uC0AC\uC5C5 \uD574\uC81C")
        : (reviewType ? reviewType.label + (isActive ? " \uC124\uC815" : " \uD574\uC81C") : "\uC0C1\uD0DC \uBCC0\uACBD");
      const note = reviewType ? safe(current[reviewType.noteKey], "") : "";
      const next = {
        ...current,
        ...patch,
        updatedAt: new Date().toISOString(),
        history: appendReviewHistory(current.history, { action, note })
      };
      state.review[key] = next;
      if (!hasReviewData(next)) delete state.review[key];
      saveReview();
      render();
    };

    const setReviewNote = (key, type, value, shouldRender = false) => {
      const current = reviewState({ bidNtceNo: key });
      const next = { ...current, updatedAt: new Date().toISOString() };
      const noteText = value.trim();
      if (noteText) {
        next[type.noteKey] = noteText;
        next[type.key] = true;
      } else {
        delete next[type.noteKey];
      }
      if (shouldRender) {
        next.history = appendReviewHistory(current.history, {
          action: type.label + " \uC0AC\uC720 \uC800\uC7A5",
          note: noteText || "\uB0B4\uC6A9 \uBE44\uC6C0"
        });
      }
      state.review[key] = next;
      if (!hasReviewData(next)) delete state.review[key];
      saveReview();
      if (shouldRender) render();
      else renderStatusBoard();
    };

    const renderSideTabs = () => {
      document.querySelectorAll("[data-side-tab]").forEach((button) => {
        const active = button.dataset.sideTab === state.sideTab;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
      });
      document.querySelectorAll("[data-side-pane]").forEach((pane) => {
        pane.hidden = pane.dataset.sidePane !== state.sideTab;
      });
    };

    const renderStatusBoard = () => {
      const reviewMeta = $("reviewMeta");
      const reviewBoard = $("reviewBoard");
      if (!reviewMeta || !reviewBoard) return;

      const statusTypes = [
        { key: "favorite", label: "\uAD00\uC2EC", tone: "favorite", icon: "star" },
        ...REVIEW_TYPES
      ];
      const groups = statusTypes.map((type) => {
        const list = state.bids.filter((item) => reviewState(item)[type.key]).sort((a, b) => {
          const ra = reviewState(a).updatedAt || "";
          const rb = reviewState(b).updatedAt || "";
          return rb.localeCompare(ra);
        });
        return { type, list };
      });
      const reviewedIds = new Set(groups.flatMap((group) => group.list.map((item) => item.bidNtceNo)));
      reviewMeta.textContent = reviewedIds.size.toLocaleString("ko-KR") + "\uAC74";
      reviewBoard.innerHTML = groups.filter((group) => group.list.length > 0).map(({ type, list }) => {
        const items = list.slice(0, 12).map((item) => {
          const review = reviewState(item);
          const note = type.key === "favorite"
            ? "\uB9C8\uAC10 " + dday(item.bidClseDt).text + " \u00B7 " + money(item.assignBudgetAmt)
            : safe(review[type.noteKey], "\uC0AC\uC720 \uBBF8\uC785\uB825");
          return `
            <button class="status-item ${state.selectedId === item.bidNtceNo ? "selected" : ""}" data-select="${item.bidNtceNo}">
              <span class="status-item-title">${safe(item.bidNtceNm)}</span>
              <span class="status-item-note">${escapeHtml(note)}</span>
            </button>
          `;
        }).join("");
        return `
          <section class="status-card">
            <div class="status-card-head">
              <span><i data-lucide="${type.icon}"></i> ${type.label}</span>
              <span class="badge ${type.tone}">${list.length.toLocaleString("ko-KR")}\uAC74</span>
            </div>
            <div class="status-list">${items}</div>
          </section>
        `;
      }).join("") || `<div class="status-empty">\uAD00\uC2EC, \uCCB4\uD06C, \uC774\uC288, \uC644\uB8CC\uB97C \uD45C\uC2DC\uD558\uBA74 \uC5EC\uAE30\uC5D0 \uBAA8\uC544\uBCF4\uC5EC\uC694.</div>`;
      createIcons();
    };

    const kstDateKey = (date) => {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(date);
      const get = (type) => parts.find((part) => part.type === type)?.value || "";
      return get("year") + "-" + get("month") + "-" + get("day");
    };

    const latestExpectedUpdate = (times) => {
      const now = new Date();
      const todayStart = new Date(kstDateKey(now) + "T00:00:00+09:00");
      const dayKeys = [
        kstDateKey(new Date(todayStart.getTime() - 86400000)),
        kstDateKey(todayStart)
      ];
      return dayKeys.flatMap((dayKey) => times.map((time) => new Date(dayKey + "T" + time + ":00+09:00")))
        .filter((date) => date.getTime() <= now.getTime())
        .sort((a, b) => b.getTime() - a.getTime())[0] || null;
    };

    const renderSyncHealth = () => {
      const element = $("syncHealth");
      if (!element) return;
      const meta = state.dataMeta || {};
      const times = meta.updateSchedule?.times || ["09:00", "12:00", "16:00"];
      const generated = meta.generatedAt ? new Date(meta.generatedAt) : null;
      const expected = latestExpectedUpdate(times);
      const now = new Date();
      let tone = "pending";
      let label = "\uC5C5\uB370\uC774\uD2B8 \uD655\uC778 \uC911";

      if (!generated || Number.isNaN(generated.getTime())) {
        tone = "error";
        label = "\uC5C5\uB370\uC774\uD2B8 \uBBF8\uD655\uC778";
      } else if (number(meta.failedCalls) > 0) {
        tone = "warning";
        label = "\uBD80\uBD84 \uC131\uACF5 \u00B7 " + number(meta.failedCalls).toLocaleString("ko-KR") + "\uAC74 \uC624\uB958";
      } else if (expected && generated.getTime() < expected.getTime() - 300000) {
        const graceEnd = expected.getTime() + 45 * 60000;
        if (now.getTime() <= graceEnd) {
          tone = "pending";
          label = "\uC608\uC815 \uC5C5\uB370\uC774\uD2B8 \uC9C4\uD589 \uC911";
        } else {
          tone = "error";
          label = "\uC5C5\uB370\uC774\uD2B8 \uC9C0\uC5F0";
        }
      } else {
        tone = "healthy";
        label = "\uC5C5\uB370\uC774\uD2B8 \uC815\uC0C1";
      }

      element.dataset.tone = tone;
      element.textContent = label;
      element.title = "\uB9C8\uC9C0\uB9C9 \uC131\uACF5 " + (generated ? formatKst(generated) + " KST" : "\uBBF8\uD655\uC778")
        + (expected ? " \u00B7 \uCD5C\uADFC \uC608\uC815 " + formatKst(expected) + " KST" : "");
    };

    const renderMetrics = () => {
      const urgent = state.bids.filter((item) => {
        const d = daysLeft(item.bidClseDt);
        return isActiveDeadline(item.bidClseDt) && d != null && d <= 7;
      });
      const bid = state.bids.filter((item) => item.serviceType === "\uACF5\uACE0").length;
      const spec = state.bids.filter((item) => item.serviceType === "\uC0AC\uC804\uADDC\uACA9").length;
      const plan = state.bids.filter((item) => item.serviceType === "\uBC1C\uC8FC\uACC4\uD68D").length;

      $("mUrgent").textContent = urgent.length.toLocaleString("ko-KR");
      $("mNew").textContent = state.bids.filter(isToday).length.toLocaleString("ko-KR");
      $("mLarge").textContent = state.bids.filter((item) => number(item.assignBudgetAmt) >= 200000000).length.toLocaleString("ko-KR");
      $("mTotal").textContent = state.bids.length.toLocaleString("ko-KR");
      $("mService").textContent = `\uACF5\uACE0 ${bid} / \uC0AC\uC804 ${spec} / \uACC4\uD68D ${plan}`;
      $("quickNewCount").textContent = state.bids.filter(isNewToday).length.toLocaleString("ko-KR");
      $("quickChangedCount").textContent = state.bids.filter(isChangedToday).length.toLocaleString("ko-KR");
      $("quick3Count").textContent = state.bids.filter((item) => isWithinDays(item, 3)).length.toLocaleString("ko-KR");
      $("quick7Count").textContent = state.bids.filter((item) => isWithinDays(item, 7)).length.toLocaleString("ko-KR");
      $("quickFavoriteCount").textContent = state.bids.filter((item) => reviewState(item).favorite).length.toLocaleString("ko-KR");
    };

    const renderPriority = () => {
      const todayAll = state.bids.filter(isToday).sort(postedNewest);
      const todayItems = uniqueBy(
        todayAll,
        (item) => [item.bidNtceNm, item.dminsttNm || item.ntceInsttNm].map((value) => safe(value, "")).join("|")
      );
      const urgentItems = uniqueBy(
        [...state.bids].filter((item) => isActiveDeadline(item.bidClseDt)).sort((a, b) => score(b) - score(a)),
        (item) => [item.bidNtceNm, item.dminsttNm || item.ntceInsttNm].map((value) => safe(value, "")).join("|")
      );
      const favoriteItems = state.bids
        .filter((item) => reviewState(item).favorite)
        .sort((a, b) => score(b) - score(a));

      const sources = { today: todayItems, urgent: urgentItems, favorite: favoriteItems };
      const titles = { today: "\uC624\uB298 \uC5C5\uB370\uC774\uD2B8", urgent: "\uB9C8\uAC10 \uC6B0\uC120 \uC0AC\uC5C5", favorite: "\uAD00\uC2EC \uC0AC\uC5C5" };
      const source = sources[state.priorityMode] || todayItems;
      const top = source.slice(0, 5);

      $("priorityTitle").textContent = titles[state.priorityMode] || titles.today;
      $("todayCount").textContent = todayAll.length.toLocaleString("ko-KR");
      $("priorityMeta").textContent = state.priorityMode === "today"
        ? todayAll.length.toLocaleString("ko-KR") + "\uAC74 \u00B7 " + todayItems.length.toLocaleString("ko-KR") + "\uAC1C \uC0AC\uC5C5"
        : "\uC0C1\uC704 " + top.length.toLocaleString("ko-KR") + "\uAC74";
      document.querySelectorAll("[data-priority-mode]").forEach((button) => {
        const active = button.dataset.priorityMode === state.priorityMode;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
      });

      $("priorityList").innerHTML = top.map((item) => {
        const d = dday(item.bidClseDt);
        const postedTime = safe(item.bidNtceRegistDt, "").slice(11, 16);
        const favorite = reviewState(item).favorite;
        return `
          <button class="priority-card ${state.selectedId === item.bidNtceNo ? "selected" : ""}" data-select="${item.bidNtceNo}">
            <div class="badge-row">
              <span class="badge ${typeClass(item)}">${typeLabel(item)}</span>
              ${state.priorityMode === "today"
                ? `<span class="badge ${isRevision(item) ? "changed" : "green"}">${isRevision(item) ? "\uC815\uC815" : "\uC2E0\uADDC"} \u00B7 ${postedTime}</span>`
                : `<span class="badge ${d.tone === "red" ? "red" : d.tone === "orange" ? "changed" : "gray"}">${d.text}</span>`}
              ${favorite ? '<span class="badge favorite">\uAD00\uC2EC</span>' : ""}
              <span class="badge gray">${contractLabel(item)}</span>
            </div>
            <div class="title-main">${safe(item.bidNtceNm)}</div>
            <div class="title-sub">${safe(item.dminsttNm || item.ntceInsttNm)} \u00B7 ${money(item.assignBudgetAmt)}</div>
          </button>
        `;
      }).join("") || `<div class="empty">${state.priorityMode === "today" ? "\uC624\uB298 \uB4F1\uB85D\uB41C \uC0AC\uC5C5\uC774 \uC5C6\uC2B5\uB2C8\uB2E4." : state.priorityMode === "favorite" ? "\uAD00\uC2EC \uC0AC\uC5C5\uC774 \uC5C6\uC2B5\uB2C8\uB2E4." : "\uC6B0\uC120 \uD655\uC778 \uC0AC\uC5C5\uC774 \uC5C6\uC2B5\uB2C8\uB2E4."}</div>`;
    };

    const renderListMode = () => {
      const todayTotal = state.bids.filter(isToday).length;
      const dateCounts = state.bids.reduce((counts, item) => {
        const key = postedDateKey(item);
        if (isDateListMode(key)) counts.set(key, (counts.get(key) || 0) + 1);
        return counts;
      }, new Map());
      const selectedDate = isDateListMode(state.listMode) ? state.listMode : "";
      const dateSelect = $("filterDate");
      $("allListCount").textContent = state.bids.length.toLocaleString("ko-KR");
      $("todayListCount").textContent = todayTotal.toLocaleString("ko-KR");
      dateSelect.innerHTML = `<option value="">\uB4F1\uB85D \uB0A0\uC9DC \uC120\uD0DD</option>${[...dateCounts.entries()]
        .sort(([a], [b]) => b.localeCompare(a))
        .map(([date, count]) => `<option value="${date}">${dateLabel(date)} \u00B7 ${count.toLocaleString("ko-KR")}\uAC74</option>`)
        .join("")}`;
      dateSelect.value = selectedDate;
      $("dateFilterControl").classList.toggle("active", Boolean(selectedDate));
      document.querySelectorAll("[data-list-mode]").forEach((button) => {
        const active = button.dataset.listMode === state.listMode;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
      });
    };

    const renderRows = () => {
      state.filtered = filteredByView();
      if (state.filtered.length && !state.filtered.some((item) => item.bidNtceNo === state.selectedId)) {
        state.selectedId = state.filtered[0].bidNtceNo;
      }
      if (!state.filtered.length) state.selectedId = "";

      const resultMeta = $("resultMeta");
      if (resultMeta) {
        const modeLabels = {
          today: "\uC624\uB298 \uC0AC\uC5C5",
          newToday: "\uC624\uB298 \uC2E0\uADDC",
          changedToday: "\uC624\uB298 \uC815\uC815",
          recent3: "\uCD5C\uADFC 3\uC77C",
          recent7: "\uCD5C\uADFC 7\uC77C",
          favorite: "\uAD00\uC2EC \uC0AC\uC5C5"
        };
        if (isDateListMode(state.listMode)) {
          resultMeta.textContent = dateLabel(state.listMode) + " \uC0AC\uC5C5 " + state.filtered.length.toLocaleString("ko-KR") + "\uAC74 \uD45C\uC2DC";
        } else if (state.listMode !== "all") {
          resultMeta.textContent = (modeLabels[state.listMode] || "\uC120\uD0DD \uC0AC\uC5C5") + " " + state.filtered.length.toLocaleString("ko-KR") + "\uAC74 \uD45C\uC2DC";
        } else {
          const todayVisible = state.filtered.filter(isToday).length;
          resultMeta.textContent = "\uC624\uB298 " + todayVisible.toLocaleString("ko-KR") + "\uAC74 \uBA3C\uC800 \u00B7 "
            + state.filtered.length.toLocaleString("ko-KR") + "\uAC74 \uD45C\uC2DC / \uC804\uCCB4 "
            + state.bids.length.toLocaleString("ko-KR") + "\uAC74";
        }
      }

      $("bidRows").innerHTML = state.filtered.map((item) => {
        const c = contact(item);
        const d = dday(item.bidClseDt);
        const r = reviewState(item);
        const revised = isRevision(item);
        const relatedCount = relatedItems(item).length;
        const revision = safe(item.bidNtceOrd, "").replace(/^0+/, "") || "0";
        return `
          <tr class="${state.selectedId === item.bidNtceNo ? "selected" : ""}" data-select="${item.bidNtceNo}">
            <td>
              <div class="title-cell">
                <div class="business-title-row">
                  <button class="favorite-button ${r.favorite ? "active" : ""}" type="button" data-favorite="${item.bidNtceNo}" title="${r.favorite ? "\uAD00\uC2EC \uD574\uC81C" : "\uAD00\uC2EC \uC124\uC815"}" aria-label="${r.favorite ? "\uAD00\uC2EC \uD574\uC81C" : "\uAD00\uC2EC \uC124\uC815"}"><i data-lucide="star"></i></button>
                  <span class="contract-prefix" title="${contractLabel(item)}">${contractLabel(item)}</span>
                  <div class="title-main">${safe(item.bidNtceNm)}</div>
                </div>
                <div class="title-sub">${safe(item.dminsttNm || item.ntceInsttNm)} \u00B7 ${safe(item.region)}</div>
                <div class="title-sub published-date">${isToday(item) ? `<span class="today-marker">\uC624\uB298</span>` : ""}\uAC8C\uC2DC ${safe(item.bidNtceRegistDt)}</div>
                <div class="badge-row">
                  ${isToday(item) && !revised ? '<span class="badge green">\uC2E0\uADDC</span>' : ""}
                  ${revised ? `<span class="badge changed">\uC815\uC815 ${revision}\uCC28</span>` : ""}
                  ${relatedCount ? `<span class="badge gray">\uAD00\uB828 ${relatedCount}\uAC74</span>` : ""}
                  ${r.checked ? '<span class="badge green">\uCCB4\uD06C</span>' : ""}
                  ${r.issue ? '<span class="badge red">\uC774\uC288</span>' : ""}
                  ${r.done ? '<span class="badge gray">\uC644\uB8CC</span>' : ""}
                </div>
              </div>
            </td>
            <td><span class="badge ${typeClass(item)}">${typeLabel(item)}</span></td>
            <td><span class="money">${money(item.assignBudgetAmt)}</span></td>
            <td><span class="dday ${d.tone}">${d.text}</span><div class="title-sub">${safe(item.bidClseDt)}${d.sub ? ` / ${d.sub}` : ""}</div></td>
            <td><strong>${c.name}</strong><div class="title-sub">${c.tel}</div></td>
          </tr>
        `;
      }).join("") || '<tr><td colspan="5"><div class="empty">\uC870\uAC74\uC5D0 \uB9DE\uB294 \uC0AC\uC5C5\uC774 \uC5C6\uC2B5\uB2C8\uB2E4.</div></td></tr>';
    };

    const noteField = (type, review) => `
      <label class="note-field ${review[type.key] ? "active" : ""}">
        <span class="note-label">
          <span>${type.noteLabel}</span>
          <span class="badge ${review[type.key] ? type.tone : "gray"}">${review[type.key] ? type.active : "\uBBF8\uD45C\uC2DC"}</span>
        </span>
        <textarea data-note="${type.key}" rows="3" placeholder="${type.placeholder}">${escapeHtml(review[type.noteKey] || "")}</textarea>
      </label>
    `;

    const renderDetail = () => {
      const item = state.bids.find((bid) => bid.bidNtceNo === state.selectedId);
      if (!item) {
        $("detailState").textContent = "\uBBF8\uC120\uD0DD";
        $("detailBody").innerHTML = '<div class="empty">\uBAA9\uB85D\uC5D0\uC11C \uC0AC\uC5C5\uC744 \uC120\uD0DD\uD558\uC138\uC694.</div>';
        return;
      }

      const c = contact(item);
      const d = dday(item.bidClseDt);
      const r = reviewState(item);
      const revision = revisionChanges(item);
      const related = relatedItems(item);
      const revisionOrder = safe(item.bidNtceOrd, "").replace(/^0+/, "") || "0";
      const history = [...(Array.isArray(r.history) ? r.history : [])].reverse().slice(0, 8);
      const statusLabel = r.issue ? "\uC774\uC288" : r.checked ? "\uCCB4\uD06C" : r.done ? "\uC644\uB8CC" : r.favorite ? "\uAD00\uC2EC" : "\uBBF8\uAC80\uD1A0";
      $("detailState").textContent = statusLabel;

      const relatedMarkup = related.map((candidate) => {
        const candidateOrder = safe(candidate.bidNtceOrd, "").replace(/^0+/, "") || "0";
        const content = `
          <div class="related-item-title">${safe(candidate.bidNtceNm)}</div>
          <div class="related-item-meta">${typeLabel(candidate)} \u00B7 ${candidateOrder}\uCC28 \u00B7 ${safe(candidate.bidNtceRegistDt)}</div>
        `;
        return candidate.bidNtceNo === item.bidNtceNo
          ? `<div class="related-item">${content}</div>`
          : `<button class="related-item" type="button" data-select="${candidate.bidNtceNo}">${content}</button>`;
      }).join("");

      const historyMarkup = history.map((entry) => `
        <div class="history-item">
          <strong>${escapeHtml(entry.action || "\uC0C1\uD0DC \uBCC0\uACBD")}</strong>
          ${entry.note ? `<div class="history-item-note">${escapeHtml(entry.note)}</div>` : ""}
          <div class="history-item-meta">${formatKst(entry.at)} KST · ${escapeHtml(entry.by || "공용 사용자")}</div>
        </div>
      `).join("");

      $("detailBody").innerHTML = `
        <div class="badge-row">
          <span class="badge ${typeClass(item)}">${typeLabel(item)}</span>
          <span class="badge ${d.tone === "red" ? "red" : d.tone === "orange" ? "changed" : "gray"}">${d.text}</span>
          ${isRevision(item) ? `<span class="badge changed">\uC815\uC815 ${revisionOrder}\uCC28</span>` : `<span class="badge green">\uC2E0\uADDC</span>`}
          ${r.favorite ? '<span class="badge favorite">\uAD00\uC2EC</span>' : ""}
          <span class="badge gray">${safe(item.bidNtceNo)}</span>
        </div>
        <h2 class="detail-title">${safe(item.bidNtceNm)}</h2>
        ${revision.labels.length ? `<div class="note-empty">\uC774\uC804 \uCC28\uC218 \uB300\uBE44 \uBCC0\uACBD: ${revision.labels.join(", ")}</div>` : ""}
        <div class="field-grid">
          ${field("\uC218\uC694\uAE30\uAD00", item.dminsttNm, { changed: revision.keys.has("institution") })}
          ${field("\uACF5\uACE0\uAE30\uAD00", item.ntceInsttNm)}
          ${field(item.serviceType === "\uACF5\uACE0" ? "\uACF5\uACE0 \uAC8C\uC2DC\uC77C" : "\uB4F1\uB85D\uC77C", item.bidNtceRegistDt)}
          ${field("\uC608\uC0B0", money(item.assignBudgetAmt), { changed: revision.keys.has("budget") })}
          ${field("\uB9C8\uAC10/\uC608\uC815", `${safe(item.bidClseDt)} / ${d.text}${d.sub ? ` (${d.sub})` : ""}`, { changed: revision.keys.has("deadline") })}
          ${field("\uB2F4\uB2F9\uC790", c.name)}
          ${field("\uC804\uD654", c.tel)}
          ${field("\uACC4\uC57D\uBC29\uBC95", item.contractMethod || item.contractMethodRaw, { changed: revision.keys.has("contract") })}
          ${field("\uD0A4\uC6CC\uB4DC/\uC9C0\uC5ED", `${safe(item.searchKeyword)} / ${safe(item.region)}`)}
        </div>
        <div class="detail-actions">
          <button class="favorite ${r.favorite ? "active" : ""}" data-action="favorite"><i data-lucide="star"></i><span>${r.favorite ? "\uAD00\uC2EC \uD574\uC81C" : "\uAD00\uC2EC"}</span></button>
          <button class="${r.checked ? "active" : ""}" data-action="checked"><i data-lucide="check-circle"></i><span>${r.checked ? "\uCCB4\uD06C \uD574\uC81C" : "\uCCB4\uD06C"}</span></button>
          <button class="${r.issue ? "active issue" : ""}" data-action="issue"><i data-lucide="badge-alert"></i><span>${r.issue ? "\uC774\uC288 \uD574\uC81C" : "\uC774\uC288"}</span></button>
          <button class="${r.done ? "active done" : ""}" data-action="done"><i data-lucide="circle-check-big"></i><span>${r.done ? "\uC644\uB8CC \uD574\uC81C" : "\uC644\uB8CC"}</span></button>
          <button data-action="copy"><i data-lucide="copy"></i><span>\uC694\uC57D \uBCF5\uC0AC</span></button>
          <a class="detail-link primary" href="${safe(item.g2bUrl, "https://www.g2b.go.kr")}" target="_blank" rel="noopener">
            <i data-lucide="external-link"></i><span>\uB098\uB77C\uC7A5\uD130 \uC6D0\uBB38</span>
          </a>
        </div>
        <div class="note-grid">
          ${REVIEW_TYPES.filter((type) => r[type.key]).map((type) => noteField(type, r)).join("") || '<div class="note-empty">\uCCB4\uD06C, \uC774\uC288, \uC644\uB8CC \uC911 \uD558\uB098\uB97C \uC120\uD0DD\uD558\uBA74 \uD574\uB2F9 \uC0AC\uC720 \uC785\uB825\uCE78\uC774 \uD45C\uC2DC\uB429\uB2C8\uB2E4.</div>'}
        </div>
        ${related.length ? `
          <section class="related-section">
            <h3 class="section-heading"><span>\uC774\uC804 \uCC28\uC218/\uAD00\uB828 \uACF5\uACE0</span><span class="badge gray">${related.length}\uAC74</span></h3>
            <div class="related-list">${relatedMarkup}</div>
          </section>
        ` : ""}
        ${history.length ? `
          <section class="history-section">
            <h3 class="section-heading"><span>\uD65C\uB3D9 \uC774\uB825</span><span class="badge gray">${history.length}\uAC74</span></h3>
            <div class="history-list">${historyMarkup}</div>
          </section>
        ` : ""}
      `;
      createIcons();
    };

    const field = (label, value, options = {}) => `
      <div class="field ${options.changed ? "changed" : ""}">
        <div class="field-label-row">
          <div class="field-label">${label}</div>
          ${options.changed ? '<span class="badge changed">\uBCC0\uACBD</span>' : ""}
        </div>
        <div class="field-value">${safe(value)}</div>
      </div>
    `;

    const copySummary = async () => {
      const item = state.bids.find((bid) => bid.bidNtceNo === state.selectedId);
      if (!item) return;
      const c = contact(item);
      const deadline = dday(item.bidClseDt);
      const review = reviewState(item);
      const reviewLines = REVIEW_TYPES
        .filter((type) => review[type.key] || safe(review[type.noteKey], ""))
        .map((type) => `${type.label}: ${safe(review[type.noteKey], "\uC0AC\uC720 \uBBF8\uC785\uB825")}`);
      const text = [
        `[DI \uC870\uB2EC \uAC80\uD1A0] ${safe(item.bidNtceNm)}`,
        `\uC720\uD615: ${typeLabel(item)} / \uBC88\uD638: ${safe(item.bidNtceNo)}`,
        `\uAE30\uAD00: ${safe(item.dminsttNm || item.ntceInsttNm)}`,
        `\uAC8C\uC2DC/\uB4F1\uB85D: ${safe(item.bidNtceRegistDt)}`,
        `\uC608\uC0B0: ${money(item.assignBudgetAmt)}`,
        `\uB9C8\uAC10: ${safe(item.bidClseDt)} (${deadline.text}${deadline.sub ? ` / ${deadline.sub}` : ""})`,
        ...reviewLines,
        `\uB2F4\uB2F9: ${c.name} / ${c.tel}`,
        `\uC6D0\uBB38: ${safe(item.g2bUrl, "https://www.g2b.go.kr")}`
      ].join("\n");
      await navigator.clipboard.writeText(text);
    };

    const render = () => {
      renderSyncHealth();
      renderMetrics();
      renderPriority();
      renderListMode();
      renderRows();
      renderStatusBoard();
      renderDetail();
      renderSideTabs();
      renderSavedFilters();
      createIcons();
    };

    const loadData = async () => {
      $("lastUpdated").textContent = "\uB370\uC774\uD130 \uB85C\uB529 \uC911";
      $("syncHealth").dataset.tone = "pending";
      $("syncHealth").textContent = "\uC5C5\uB370\uC774\uD2B8 \uD655\uC778 \uC911";
      const response = await fetch(`./data/bids.json?t=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      state.rawBids = Array.isArray(payload.bids) ? payload.bids : [];
      state.bids = dedupeBids(state.rawBids);
      state.dataMeta = payload;
      const times = payload.updateSchedule?.times || ["09:00", "12:00", "16:00"];
      $("lastUpdated").textContent = payload.generatedAt ? `\uCD5C\uC885 \uC5C5\uB370\uC774\uD2B8 ${formatKst(payload.generatedAt)} KST` : "\uC5C5\uB370\uC774\uD2B8 \uC2DC\uAC01 \uBBF8\uD655\uC778";
      $("nextUpdate").textContent = `\uC608\uC815 ${times.join(", ")} KST`;
      state.selectedId = [...state.bids].sort(todayFirst)[0]?.bidNtceNo || "";
      render();
    };

    document.addEventListener("click", (event) => {
      const favoriteKey = event.target.closest("[data-favorite]")?.dataset.favorite;
      if (favoriteKey) {
        const current = reviewState({ bidNtceNo: favoriteKey });
        setReview(favoriteKey, { favorite: !current.favorite });
        return;
      }

      const listMode = event.target.closest("[data-list-mode]")?.dataset.listMode;
      if (listMode) {
        state.listMode = listMode;
        state.savedFilterId = "";
        render();
        return;
      }

      const priorityMode = event.target.closest("[data-priority-mode]")?.dataset.priorityMode;
      if (priorityMode) {
        state.priorityMode = priorityMode;
        renderPriority();
        createIcons();
        return;
      }

      const sideTab = event.target.closest("[data-side-tab]")?.dataset.sideTab;
      if (sideTab) {
        state.sideTab = sideTab;
        renderSideTabs();
        createIcons();
        return;
      }

      const select = event.target.closest("[data-select]");
      if (select) {
        state.selectedId = select.dataset.select;
        if (select.closest("#reviewBoard")) state.sideTab = "detail";
        render();
        return;
      }

      const action = event.target.closest("[data-action]")?.dataset.action;
      if (!action || !state.selectedId) return;
      const r = reviewState({ bidNtceNo: state.selectedId });
      if (action === "favorite") setReview(state.selectedId, { favorite: !r.favorite });
      if (action === "checked") setReview(state.selectedId, { checked: !r.checked });
      if (action === "issue") setReview(state.selectedId, { issue: !r.issue });
      if (action === "done") setReview(state.selectedId, { done: !r.done });
      if (action === "copy") copySummary();
    });

    document.addEventListener("input", (event) => {
      const noteType = event.target.closest("[data-note]")?.dataset.note;
      if (!noteType || !state.selectedId) return;
      const type = reviewTypeByKey(noteType);
      if (!type) return;
      setReviewNote(state.selectedId, type, event.target.value);
    });

    document.addEventListener("change", (event) => {
      const noteType = event.target.closest("[data-note]")?.dataset.note;
      if (!noteType || !state.selectedId) return;
      const type = reviewTypeByKey(noteType);
      if (!type) return;
      setReviewNote(state.selectedId, type, event.target.value, true);
    });

    $("filterControls").addEventListener("change", () => {
      state.savedFilterId = "";
      state.filters = {
        service: $("filterService").value,
        contract: $("filterContract").value,
        keyword: $("filterKeyword").value,
        region: $("filterRegion").value,
        budget: $("filterBudget").value
      };
      render();
    });

    $("filterDate").addEventListener("change", (event) => {
      state.savedFilterId = "";
      state.listMode = event.target.value || "all";
      render();
    });

    $("searchInput").addEventListener("input", (event) => {
      state.savedFilterId = "";
      state.query = event.target.value;
      render();
    });

    $("reviewerNameInput").value = state.reviewerName;
    $("reviewerNameInput").addEventListener("change", (event) => {
      state.reviewerName = event.target.value.trim();
      localStorage.setItem(REVIEWER_KEY, state.reviewerName);
    });

    $("savedFilter").addEventListener("change", (event) => {
      if (event.target.value) applySavedFilter(event.target.value);
      else {
        state.savedFilterId = "";
        renderSavedFilters();
      }
    });

    $("saveFilterBtn").addEventListener("click", saveCurrentFilter);
    $("deleteFilterBtn").addEventListener("click", deleteSavedFilter);
    $("resetFiltersBtn").addEventListener("click", resetFilters);

    $("refreshBtn").addEventListener("click", () => {
      loadData().catch((error) => {
        $("lastUpdated").textContent = `\uB85C\uB4DC \uC2E4\uD328: ${error.message}`;
        $("syncHealth").dataset.tone = "error";
        $("syncHealth").textContent = "\uC5C5\uB370\uC774\uD2B8 \uB85C\uB4DC \uC2E4\uD328";
      });
    });

    loadData().catch((error) => {
      $("lastUpdated").textContent = `\uB85C\uB4DC \uC2E4\uD328: ${error.message}`;
      $("syncHealth").dataset.tone = "error";
      $("syncHealth").textContent = "\uC5C5\uB370\uC774\uD2B8 \uB85C\uB4DC \uC2E4\uD328";
      $("bidRows").innerHTML = `<tr><td colspan="5"><div class="empty">\uB370\uC774\uD130\uB97C \uBD88\uB7EC\uC624\uC9C0 \uBABB\uD588\uC2B5\uB2C8\uB2E4.</div></td></tr>`;
    });
    initializeReviewSync();
  </script>
</body>
</html>
