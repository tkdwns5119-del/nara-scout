    ];

    const WORK_GROUPS = [
      { id: "install", label: "제작·설치·구축", pattern: /(제작\s*설치|제조\s*구매\s*설치|구매\s*설치|구입\s*설치|설치|구축|조성|도입)/i },
      { id: "maintenance", label: "유지보수·교체", pattern: /(유지보수|유지관리|보수|교체|철거|이전\s*설치|기능개선|수리|예비품)/i },
      { id: "content", label: "콘텐츠 제작", pattern: /(콘텐츠|영상\s*제작|미디어아트\s*제작)/i },
      { id: "rental", label: "임차·운영", pattern: /(임차|렌탈|운영|운영관리|운영\s*대행)/i },
      { id: "design", label: "설계·감리", pattern: /(기본설계|실시설계|설계용역|감리)/i },
      { id: "purchase", label: "구매·납품", pattern: /(구매|구입|납품|관급자재|지급자재|조달물품)/i }
    ];

    const reviewTypeByKey = (key) => REVIEW_TYPES.find((type) => type.key === key);

    const hasReviewData = (review) => Boolean(review?.favorite || review?.history?.length) || REVIEW_TYPES.some((type) => review[type.key] || safe(review[type.noteKey], ""));

    const number = (value) => Number(value || 0);

    const money = (value) => {
      const n = number(value);
      if (!n) return "예산 미확인";
      if (n >= 100000000) return `${Math.round(n / 100000000).toLocaleString("ko-KR")}억`;
      if (n >= 10000) return `${Math.round(n / 10000).toLocaleString("ko-KR")}만`;
      return `${n.toLocaleString("ko-KR")}원`;
    };

    const parseDate = (value) => {
      const text = safe(value, "").slice(0, 16);
      if (!text) return null;
      const normalized = text.replace(/\./g, "-").replace(/\//g, "-").replace(" ", "T");
      const date = new Date(normalized);
      return Number.isNaN(date.getTime()) ? null : date;
    };

    const deadlineInfo = (value) => {
      const date = parseDate(value);
      if (!date) return { days: null, hours: null, overdue: false };
      const diffMs = date.getTime() - Date.now();
      const days = Math.ceil(diffMs / 86400000);
      const hours = Math.ceil(Math.abs(diffMs) / 3600000);
      return { days, hours, overdue: diffMs < 0 };
    };

    const daysLeft = (value) => deadlineInfo(value).days;

    const isActiveDeadline = (value) => {
      const info = deadlineInfo(value);
      return info.days != null && !info.overdue;
    };

    const dday = (value) => {
      if (/^\d{4}-\d{2}$/.test(safe(value, ""))) {
        return { text: "계획", tone: "gray", overdue: false };
      }
      const info = deadlineInfo(value);
      if (info.days == null) return { text: "\uC77C\uC815 \uBBF8\uD655\uC778", tone: "gray", overdue: false };
      if (info.overdue) {
        const elapsed = info.hours < 24 ? `${info.hours}\uC2DC\uAC04` : `${Math.ceil(info.hours / 24)}\uC77C`;
        return { text: "\uB9C8\uAC10 \uC9C0\uB0A8", sub: `${elapsed} \uACBD\uACFC`, tone: "gray", overdue: true };
      }
      const target = parseDate(value);
      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const targetStart = new Date(target.getFullYear(), target.getMonth(), target.getDate());
      const calendarDays = Math.round((targetStart.getTime() - todayStart.getTime()) / 86400000);
      if (calendarDays === 0) return { text: "D-DAY", tone: "red", overdue: false };
      if (calendarDays <= 3) return { text: `D-${calendarDays}`, tone: "red", overdue: false };
      if (calendarDays <= 7) return { text: `D-${calendarDays}`, tone: "orange", overdue: false };
      return { text: `D-${calendarDays}`, tone: "gray", overdue: false };
    };

    const formatKst = (value) => {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(date);
    };

    const typeClass = (item) => {
      if (item.serviceType === "사전규격") return "spec";
      if (item.serviceType === "발주계획") return "plan";
      return "bid";
    };

    const typeLabel = (item) => safe(item.serviceType, "공고");

    const contractLabel = (item) => {
      const raw = safe(item.contractMethod || item.contractMethodRaw, "");
      if (!raw || raw === item.serviceType) return "\uACC4\uC57D \uBBF8\uC815";
      return raw.replace(/\s*\/\s*/g, " \u00B7 ");
    };

    const contact = (item) => {
      const detail = item.detailInfo || {};
      return {
        name: safe(detail.officerName || item.officerName, "담당자 미확인"),
        tel: safe(detail.officerTel || item.officerTel, "전화 미확인"),
        email: safe(detail.officerEmail || item.officerEmail, ""),
        dept: safe(detail.department || item.department, "")
      };
    };

    const keywordSources = (item) => {
      const detail = item.detailInfo || {};
      return [
        { label: "사업명", text: safe(item.bidNtceNm, "") },
        { label: "품명", text: safe(detail.productName, "") },
        { label: "세부품목", text: safe(detail.productDetails, "") },
        { label: "사용목적", text: safe(detail.purpose, "") }
      ].filter((source) => source.text);
    };

    const classifyKeywords = (item) => {
      const sources = keywordSources(item);
      const fullText = sources.map((source) => source.text).join(" ");
      const matchedGroups = KEYWORD_GROUPS.filter((group) => group.pattern.test(fullText) && !(group.exclude && group.exclude.test(fullText)));
      const productPriority = [
        "vms_vibration", "display_traffic", "vms_road", "display_safety", "display_sports", "display_info", "display_indoor", "display_outdoor",
        "facade_install", "facade_content", "facade_maintenance", "facade_all",
        "signage_system", "signage_guidance", "signage_equipment", "signage_all",
        "its_equipment", "its_construction", "its_plan", "its_event", "its_other", "its_all",
        "media_it", "media_education", "media_art", "media_content", "media_facility", "media_event", "media_other", "media_all",
        "display_transport", "display_video", "display_monitor", "display_research", "display_keyword_other", "display_keyword_all",
        "led_display", "led_control", "led_lighting", "led_research", "led_other", "led_all", "display_general", "display_all"
      ];
      const primary = productPriority.map((id) => matchedGroups.find((group) => group.id === id)).find(Boolean) || null;
      const matchedWorks = WORK_GROUPS.filter((group) => group.pattern.test(fullText));
      if (!matchedWorks.length && item.businessType === "물품") {
        const purchase = WORK_GROUPS.find((group) => group.id === "purchase");
        if (purchase) matchedWorks.push(purchase);
      }
      const workPriority = ["maintenance", "content", "rental", "design", "install", "purchase"];
      const primaryWork = workPriority.map((id) => matchedWorks.find((group) => group.id === id)).find(Boolean) || null;
      let evidence = "키워드 미분류";
      let matchedTerm = "";
      if (primary) {
        const source = sources.find((entry) => primary.pattern.test(entry.text) && !(primary.exclude && primary.exclude.test(entry.text)));
        const match = source?.text.match(primary.pattern);
        evidence = source ? `${source.label} 일치` : "상세정보 일치";
        matchedTerm = match?.[0]?.replace(/\s+/g, " ").trim() || "";
      }
      return {
        groups: matchedGroups.map((group) => group.id),
        works: matchedWorks.map((group) => group.id),
        primaryId: primary?.id || "",
        primaryLabel: primary?.label || "기타 디스플레이",
        workId: primaryWork?.id || "",
        workLabel: primaryWork?.label || "업무 미분류",
        evidence,
        matchedTerm
      };
    };

    const displayScope = (item) => {
      const fullText = keywordSources(item).map((source) => source.text).join(" ");
      const hasLed = /(\bled\b|\boled\b|toled|oledos)/i.test(fullText);
      if (!hasLed) return { excluded: false, reason: "" };
      const explicitDisplay = /(전광판|전광표지|안내전광|문자전광|전자게시대|사이니지|미디어\s*월|비디오\s*월|\bled\b\s*(display|디스플레이|스크린|영상시스템|상황판)|전광판.*\bled\b|\bled\b.*(제어시스템|컨트롤러|송수신카드|함체))/i;
      const clearNonDisplay = /(toled|oledos|uv-c\s*led|\bled\b.*(조명|등기구|가로등|bar|dimming|측정|probe|솔라|실험|광융합|센서|수심게이지)|(조명|등기구|가로등).*\bled\b)/i;
      if (clearNonDisplay.test(fullText) && !explicitDisplay.test(fullText)) {
        return { excluded: true, reason: "LED 조명·연구·특수장비로 전광판 분야가 아님" };
      }
      const displayRelated = new RegExp(`${explicitDisplay.source}|영상정보디스플레이장치`, "i");
      if (displayRelated.test(fullText)) return { excluded: false, reason: "" };
      return { excluded: true, reason: "전광판·영상 디스플레이와 연결되지 않은 LED 사업" };
    };

    const matchesKeywordGroup = (item, groupId) => {
      if (!groupId || groupId === "ALL") return true;
      const primaryOnly = new Set(["display_general", "led_other", "display_keyword_other", "media_other", "its_other"]);
      if (primaryOnly.has(groupId)) return item._keyword.primaryId === groupId;
      return item._keyword.groups.includes(groupId);
    };

    const participation = (item) => {
      const detail = item.detailInfo || {};
      const methods = [item.contractMethod, detail.contractMethodRaw, detail.contractType, detail.bidMethod, detail.awardMethod]
        .filter(Boolean)
        .join(" ");
      if (item.serviceType === "발주계획") {
        return { key: "check", label: "확인 필요", reason: "발주계획 단계로 참가 조건과 공고 일정이 아직 확정되지 않았습니다." };
      }
      if (!isActiveDeadline(item.bidClseDt || detail.opinionCloseDt) && parseDate(item.bidClseDt || detail.opinionCloseDt)) {
        return { key: "closed", label: "마감", reason: "공고 일정이 종료되었습니다." };
      }
      if (/(수의시담|전자시담|다자간수의시담|계약대상자)/.test(methods)) {
        return { key: "restricted", label: "참여 제한", reason: "수의시담·전자시담 방식으로 지정된 대상자만 참여할 수 있습니다." };
      }
      if (item.serviceType === "사전규격") {
        return { key: "check", label: "확인 필요", reason: "사전규격 단계로 실제 입찰 공고와 참가 조건을 다시 확인해야 합니다." };
      }
      const registerDeadline = parseDate(detail.registerDeadline);
      if (registerDeadline && registerDeadline.getTime() < Date.now()) {
        return { key: "check", label: "확인 필요", reason: "참가자격 등록 마감이 지났습니다. 기존 등록 여부를 확인하세요." };
      }
      if (detail.restrictionRegion) {
        return { key: "check", label: "확인 필요", reason: `지역 제한(${detail.restrictionRegion}) 충족 여부를 확인해야 합니다.` };
      }
      if (!detail.bidMethod && !detail.awardMethod) {
        return { key: "check", label: "확인 필요", reason: "입찰·낙찰 방식 정보가 없어 원문 확인이 필요합니다." };
      }
      return { key: "possible", label: "참여 가능", reason: "공개 전자입찰로 확인됩니다. 세부 자격과 제한은 원문에서 최종 확인하세요." };
    };

    const keywordTone = (label) => {
      if (label.startsWith("[비대상]") || label.startsWith("[제외]")) return "classification-low";
      if (label.startsWith("[확인]")) return "classification-check";
      return "";
    };

    const participationTone = (key) => ({ possible: "green", check: "changed", restricted: "red", closed: "gray" })[key] || "gray";

    const shortDateTime = (value) => {
      const text = safe(value, "");
      if (!text) return "미정";
      return text.length >= 16 ? `${text.slice(5, 10).replace("-", ".")} ${text.slice(11, 16)}` : text;
    };

    const enrichBid = (item) => ({
      ...item,
      _keyword: classifyKeywords(item),
      _scope: displayScope(item),
      _participation: participation(item)
    });

    const displayKey = (item) => [
      item.serviceType,
      item.bidNtceNm,
      item.dminsttNm || item.ntceInsttNm,
      item.bidClseDt,
      item.assignBudgetAmt
    ].map((value) => safe(value, "")).join("|");

    const dedupeBids = (items) => {
      const map = new Map();
      for (const item of items) {
        const bidNumber = safe(item.bidNtceNo, "");
        const key = bidNumber ? [item.serviceType, bidNumber].join("|") : displayKey(item);
        const current = map.get(key);
        if (!current
          || revisionNumber(item) > revisionNumber(current)
          || (revisionNumber(item) === revisionNumber(current) && postedNewest(item, current) < 0)) {
          map.set(key, item);
        }
      }
      return [...map.values()];
    };

    const uniqueBy = (items, getKey) => {
      const seen = new Set();
      return items.filter((item) => {
        const key = getKey(item);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    };

    const reviewState = (item) => state.review[item.bidNtceNo] || {};

    const revisionNumber = (item) => Number.parseInt(safe(item.bidNtceOrd, "0"), 10) || 0;

    const revisionSiblings = (item) => uniqueBy(
      state.rawBids.filter((candidate) => candidate.bidNtceNo === item.bidNtceNo),
      (candidate) => [candidate.bidNtceNo, candidate.bidNtceOrd, candidate.serviceType].join("|")
    ).sort((a, b) => revisionNumber(b) - revisionNumber(a));

    const isRevision = (item) => revisionNumber(item) > 0 || revisionSiblings(item).some((candidate) => revisionNumber(candidate) < revisionNumber(item));

    const revisionChanges = (item) => {
      const previous = revisionSiblings(item).find((candidate) => revisionNumber(candidate) < revisionNumber(item));
      if (!previous) return { previous: null, labels: [], keys: new Set() };
      const fields = [
        { key: "title", label: "\uC0AC\uC5C5\uBA85", get: (value) => safe(value.bidNtceNm, "") },
        { key: "budget", label: "\uC608\uC0B0", get: (value) => number(value.assignBudgetAmt) },
        { key: "deadline", label: "\uB9C8\uAC10", get: (value) => safe(value.bidClseDt, "") },
        { key: "contract", label: "\uACC4\uC57D\uBC29\uBC95", get: (value) => contractLabel(value) },
        { key: "institution", label: "\uC218\uC694\uAE30\uAD00", get: (value) => safe(value.dminsttNm || value.ntceInsttNm, "") }
      ];
      const changed = fields.filter((fieldInfo) => fieldInfo.get(item) !== fieldInfo.get(previous));
      return { previous, labels: changed.map((fieldInfo) => fieldInfo.label), keys: new Set(changed.map((fieldInfo) => fieldInfo.key)) };
    };

    const normalizedBusinessTitle = (value) => safe(value, "")
      .toLowerCase()
      .replace(/(?:\uAE34\uAE09|\uC7AC\uACF5\uACE0)/g, "")
      .replace(/[^0-9a-z\uAC00-\uD7A3]/g, "");

    const relatedItems = (item) => {
      const titleKey = normalizedBusinessTitle(item.bidNtceNm);
      const institution = safe(item.dminsttNm || item.ntceInsttNm, "");
      const currentKey = [item.bidNtceNo, item.bidNtceOrd, item.serviceType].join("|");
      return uniqueBy(
        state.rawBids.filter((candidate) => {
          const candidateKey = [candidate.bidNtceNo, candidate.bidNtceOrd, candidate.serviceType].join("|");
          if (candidateKey === currentKey) return false;
          if (candidate.bidNtceNo === item.bidNtceNo) return true;
          return titleKey && normalizedBusinessTitle(candidate.bidNtceNm) === titleKey
            && safe(candidate.dminsttNm || candidate.ntceInsttNm, "") === institution;
        }),
        (candidate) => [candidate.bidNtceNo, candidate.bidNtceOrd, candidate.serviceType].join("|")
      ).sort(postedNewest).slice(0, 6);
    };

    const isWithinDays = (item, days) => {
      const posted = postedDateKey(item);
      if (!isDateListMode(posted)) return false;
      const todayStart = new Date(kstDayKey() + "T00:00:00+09:00");
      const postedAt = new Date(posted + "T00:00:00+09:00");
      const elapsed = Math.floor((todayStart.getTime() - postedAt.getTime()) / 86400000);
      return elapsed >= 0 && elapsed < days;
    };

    const isNewToday = (item) => isToday(item) && !isRevision(item);
    const isChangedToday = (item) => isToday(item) && isRevision(item);

    const score = (item) => {
      const days = daysLeft(item.bidClseDt);
      const active = isActiveDeadline(item.bidClseDt);
      let value = 0;
      if (active && days != null && days <= 2) value += 50;
      else if (active && days != null && days <= 7) value += 34;
      if (!active && days != null) value -= 60;
      if (number(item.assignBudgetAmt) >= 500000000) value += 28;
      else if (number(item.assignBudgetAmt) >= 200000000) value += 20;
      else if (number(item.assignBudgetAmt) >= 50000000) value += 10;
      if (item.serviceType === "공고") value += 12;
      if (item.serviceType === "사전규격") value += 10;
      if (reviewState(item).issue) value += 30;
      if (reviewState(item).checked) value += 8;
      return value;
    };

    const isNew = (item) => {
      const date = parseDate(item.bidNtceRegistDt);
      if (!date) return false;
      return Date.now() - date.getTime() <= 86400000;
    };

    const kstDayKey = () => {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
      const get = (type) => parts.find((part) => part.type === type)?.value || "";
      return `${get("year")}-${get("month")}-${get("day")}`;
    };

    const postedDateKey = (item) => safe(item.bidNtceRegistDt, "").slice(0, 10);

    const isToday = (item) => postedDateKey(item) === kstDayKey();

    const isDateListMode = (value) => /^\d{4}-\d{2}-\d{2}$/.test(value);

    const dateLabel = (value) => {
      const date = new Date(`${value}T00:00:00+09:00`);
      if (Number.isNaN(date.getTime())) return value;
      return new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul",
        month: "long",
        day: "numeric",
        weekday: "short"
      }).format(date);
    };

    const postedNewest = (a, b) => safe(b.bidNtceRegistDt, "").localeCompare(safe(a.bidNtceRegistDt, ""));

    const todayFirst = (a, b) => {
      const todayRank = Number(isToday(b)) - Number(isToday(a));
      if (todayRank) return todayRank;
      if (isToday(a) && isToday(b)) return postedNewest(a, b);
      return score(b) - score(a) || safe(a.bidClseDt).localeCompare(safe(b.bidClseDt));
    };

    const isUnchecked = (item) => {
      const r = reviewState(item);
      return !r.checked && !r.issue && !r.done;
    };

    const filteredByView = () => {
      let list = [...state.bids];
      const filters = state.filters;

      if (state.listMode === "today") list = list.filter(isToday);
      else if (state.listMode === "newToday") list = list.filter(isNewToday);
      else if (state.listMode === "changedToday") list = list.filter(isChangedToday);
      else if (state.listMode === "recent3") list = list.filter((item) => isWithinDays(item, 3));
      else if (state.listMode === "recent7") list = list.filter((item) => isWithinDays(item, 7));
      else if (state.listMode === "favorite") list = list.filter((item) => reviewState(item).favorite);
      else if (isDateListMode(state.listMode)) list = list.filter((item) => postedDateKey(item) === state.listMode);

      if (filters.service !== "ALL") list = list.filter((item) => item.serviceType === filters.service);
      if (filters.contract !== "ALL") {
        list = list.filter((item) => safe(item.contractMethod || item.contractMethodRaw, "").includes(filters.contract));
      }
      if (filters.keyword !== "ALL") {
        list = list.filter((item) => safe(item.searchKeyword, "") === filters.keyword || safe(item.bidNtceNm, "").includes(filters.keyword));
      }
      if (filters.keywordDetail !== "ALL") {
        list = list.filter((item) => matchesKeywordGroup(item, filters.keywordDetail));
      }
      if (filters.work !== "ALL") {
        list = list.filter((item) => item._keyword.works.includes(filters.work));
      }
      if (filters.participation !== "ALL") {
        list = list.filter((item) => item._participation.key === filters.participation);
      }
      if (filters.region !== "ALL") list = list.filter((item) => item.region === filters.region);
      if (filters.budget !== "ALL") {
        list = list.filter((item) => {
          const amount = number(item.assignBudgetAmt);
          if (filters.budget === "UNDER_50") return amount < 50000000;
          if (filters.budget === "50_TO_200") return amount >= 50000000 && amount <= 200000000;
          if (filters.budget === "200_TO_500") return amount > 200000000 && amount <= 500000000;
          if (filters.budget === "OVER_500") return amount > 500000000;
          return true;
        });
      }

      const query = state.query.toLowerCase();
      if (query) {
        list = list.filter((item) => {
          const c = contact(item);
          const detail = item.detailInfo || {};
          return [
            item.bidNtceNm,
            item.ntceInsttNm,
            item.dminsttNm,
            item.bidNtceNo,
            item.contractMethod,
            item.searchKeyword,
            item.region,
            c.name,
            c.tel,
            detail.productName,
            detail.productDetails,
            detail.purpose
          ].some((value) => safe(value, "").toLowerCase().includes(query));
        });
      }

      if (state.listMode === "favorite") {
        return list.sort((a, b) => safe(reviewState(b).updatedAt, "").localeCompare(safe(reviewState(a).updatedAt, "")) || todayFirst(a, b));
      }
      return list.sort(todayFirst);
    };

    const scheduleReviewSync = () => {
      if (reviewRemoteApplying || !reviewRemoteRef) return;
      clearTimeout(reviewSaveTimer);
      reviewSaveTimer = setTimeout(async () => {
        try {
          await reviewRemoteRef.set(state.review || {});
          setReviewSyncState("\uac80\ud1a0\ud568 \uacf5\uc720 \uc5f0\uacb0");
        } catch {
          setReviewSyncState("\uac80\ud1a0\ud568 \ub85c\uceec \uc800\uc7a5");
        }
      }, 500);
    };

    const saveReview = (options = {}) => {
      localStorage.setItem(REVIEW_KEY, JSON.stringify(state.review));
      if (!options.skipRemote) scheduleReviewSync();
    };

    const saveStoredFilters = () => {
      localStorage.setItem(FILTER_KEY, JSON.stringify(state.savedFilters));
    };

    const currentFilterSnapshot = () => ({
      filters: { ...state.filters },
      query: state.query,
      listMode: state.listMode
    });

    const filterSnapshotLabel = () => {
      const parts = [];
      const listLabels = {
        today: "\uC624\uB298 \uC0AC\uC5C5",
        newToday: "\uC624\uB298 \uC2E0\uADDC",
        changedToday: "\uC624\uB298 \uC815\uC815",
        recent3: "\uCD5C\uADFC 3\uC77C",
        recent7: "\uCD5C\uADFC 7\uC77C",
        favorite: "\uAD00\uC2EC \uC0AC\uC5C5"
      };
      if (isDateListMode(state.listMode)) parts.push(dateLabel(state.listMode));
      else if (listLabels[state.listMode]) parts.push(listLabels[state.listMode]);

      ["filterService", "filterContract", "filterKeyword", "filterKeywordDetail", "filterWork", "filterParticipation", "filterRegion", "filterBudget"].forEach((id) => {
        const select = $(id);
        if (select?.value && select.value !== "ALL") {
          parts.push(select.selectedOptions[0]?.textContent?.trim() || select.value);
        }
      });
      if (state.query) parts.push('"' + state.query + '"');
      return parts.slice(0, 4).join(" \u00B7 ") || "\uC804\uCCB4 \uC0AC\uC5C5";
    };

    const renderSavedFilters = () => {
      const select = $("savedFilter");
      if (!select) return;
      const filters = Array.isArray(state.savedFilters) ? state.savedFilters : [];
      select.innerHTML = '<option value="">\uC800\uC7A5 \uD544\uD130</option>' + filters
        .map((item) => '<option value="' + escapeHtml(item.id) + '">' + escapeHtml(item.label) + "</option>")
        .join("");
      select.value = filters.some((item) => item.id === state.savedFilterId) ? state.savedFilterId : "";
      $("deleteFilterBtn").disabled = !select.value;
    };

    const syncFilterControls = () => {
      $("filterService").value = state.filters.service;
      $("filterContract").value = state.filters.contract;
      $("filterKeyword").value = state.filters.keyword;
      $("filterKeywordDetail").value = state.filters.keywordDetail;
      $("filterWork").value = state.filters.work;
      $("filterParticipation").value = state.filters.participation;
      $("filterRegion").value = state.filters.region;
      $("filterBudget").value = state.filters.budget;
      $("searchInput").value = state.query;
    };

    const saveCurrentFilter = () => {
      const filters = Array.isArray(state.savedFilters) ? state.savedFilters : [];
      const snapshot = currentFilterSnapshot();
      const serialized = JSON.stringify(snapshot);
      const existing = filters.find((item) => JSON.stringify(item.snapshot) === serialized);
      if (existing) {
        state.savedFilterId = existing.id;
      } else {
        const item = { id: String(Date.now()), label: filterSnapshotLabel(), snapshot };
        state.savedFilters = [item, ...filters].slice(0, 12);
        state.savedFilterId = item.id;
        saveStoredFilters();
      }
      renderSavedFilters();
    };

    const applySavedFilter = (id) => {
      const item = (Array.isArray(state.savedFilters) ? state.savedFilters : []).find((candidate) => candidate.id === id);
      if (!item) return;
      state.savedFilterId = id;
      state.filters = {
        service: "ALL",
        contract: "ALL",
        keyword: "ALL",
        keywordDetail: "ALL",
        work: "ALL",
        participation: "ALL",
        region: "ALL",
        budget: "ALL",
        ...(item.snapshot?.filters || {})
      };
      state.query = safe(item.snapshot?.query, "");
      state.listMode = item.snapshot?.listMode || "all";
      syncFilterControls();
      render();
    };

    const deleteSavedFilter = () => {
      if (!state.savedFilterId) return;
      state.savedFilters = (Array.isArray(state.savedFilters) ? state.savedFilters : [])
        .filter((item) => item.id !== state.savedFilterId);
      state.savedFilterId = "";
      saveStoredFilters();
      renderSavedFilters();
    };

    const resetFilters = () => {
      state.filters = {
        service: "ALL",
        contract: "ALL",
        keyword: "ALL",
        keywordDetail: "ALL",
        work: "ALL",
        participation: "ALL",
        region: "ALL",
        budget: "ALL"
      };
      state.query = "";
      state.listMode = "all";
      state.savedFilterId = "";
      syncFilterControls();
      render();
    };

    const initializeReviewSync = async () => {
      setReviewSyncState("\uac80\ud1a0\ud568 \ub3d9\uae30\ud654 \uc911");
      try {
        const response = await fetch("./data/workflow-config.json?t=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const config = await response.json();
        if (config.provider !== "firebase") throw new Error("\uacf5\uc720 \uc800\uc7a5\uc18c \ubbf8\uc0ac\uc6a9");

        const firebaseConfig = { ...(config.firebaseConfig || {}) };
        if (!firebaseConfig.apiKey && Array.isArray(firebaseConfig.apiKeyParts)) {
          firebaseConfig.apiKey = firebaseConfig.apiKeyParts.join("");
        }
        delete firebaseConfig.apiKeyParts;

        await loadExternalScript("https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js");
        await loadExternalScript("https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js");

        let app;
        try {
          app = firebase.app(REVIEW_SYNC_APP);
        } catch {
          app = firebase.initializeApp(firebaseConfig, REVIEW_SYNC_APP);
        }

        reviewRemoteRef = firebase.database(app).ref(config.issuePath || "importantIssues");
        const snapshot = await reviewRemoteRef.once("value");
        state.review = mergeReviewStores(state.review, snapshot.val() || {});
        saveReview({ skipRemote: true });
        await reviewRemoteRef.set(state.review || {});

        reviewRemoteRef.on("value", (nextSnapshot) => {
          reviewRemoteApplying = true;
          state.review = nextSnapshot.val() || {};
          saveReview({ skipRemote: true });
          reviewRemoteApplying = false;
          render();
          setReviewSyncState("\uac80\ud1a0\ud568 \uacf5\uc720 \uc5f0\uacb0");
        });

        setReviewSyncState("\uac80\ud1a0\ud568 \uacf5\uc720 \uc5f0\uacb0");
      } catch (error) {
        console.warn("Review sync unavailable", error);
        setReviewSyncState("\uac80\ud1a0\ud568 \ub85c\uceec \uc800\uc7a5");
      }
    };

    const appendReviewHistory = (history, entry) => [
      ...(Array.isArray(history) ? history : []),
      { at: new Date().toISOString(), by: state.reviewerName || "공용 사용자", ...entry }
    ].slice(-30);

    const setReview = (key, patch) => {
      const current = reviewState({ bidNtceNo: key });
      const changedKey = Object.keys(patch)[0];
      const isActive = Boolean(patch[changedKey]);
      const reviewType = reviewTypeByKey(changedKey);
      const action = changedKey === "favorite"
        ? (isActive ? "\uAD00\uC2EC \uC0AC\uC5C5 \uC124\uC815" : "\uAD00\uC2EC \uC0AC\uC5C5 \uD574\uC81C")
        : (reviewType ? reviewType.label + (isActive ? " \uC124\uC815" : " \uD574\uC81C") : "\uC0C1\uD0DC \uBCC0\uACBD");
      const note = reviewType ? safe(current[reviewType.noteKey], "") : "";
      const next = {
        ...current,
        ...patch,
        updatedAt: new Date().toISOString(),
        history: appendReviewHistory(current.history, { action, note })
      };
      state.review[key] = next;
      if (!hasReviewData(next)) delete state.review[key];
      saveReview();
      render();
    };

    const setReviewNote = (key, type, value, shouldRender = false) => {
      const current = reviewState({ bidNtceNo: key });
      const next = { ...current, updatedAt: new Date().toISOString() };
      const noteText = value.trim();
      if (noteText) {
        next[type.noteKey] = noteText;
        next[type.key] = true;
      } else {
        delete next[type.noteKey];
      }
      if (shouldRender) {
        next.history = appendReviewHistory(current.history, {
          action: type.label + " \uC0AC\uC720 \uC800\uC7A5",
          note: noteText || "\uB0B4\uC6A9 \uBE44\uC6C0"
        });
      }
      state.review[key] = next;
      if (!hasReviewData(next)) delete state.review[key];
      saveReview();
      if (shouldRender) render();
      else renderStatusBoard();
    };

    const renderSideTabs = () => {
      document.querySelectorAll("[data-side-tab]").forEach((button) => {
        const active = button.dataset.sideTab === state.sideTab;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
      });
      document.querySelectorAll("[data-side-pane]").forEach((pane) => {
        pane.hidden = pane.dataset.sidePane !== state.sideTab;
      });
    };

    const openMobileSide = () => {
      if (!window.matchMedia("(max-width: 760px)").matches) return;
      const side = $("detailSide");
      side.classList.add("mobile-open");
      requestAnimationFrame(() => side.scrollIntoView({ behavior: "smooth", block: "start" }));
    };

    const closeMobileSide = () => {
      $("detailSide")?.classList.remove("mobile-open");
    };

    const renderStatusBoard = () => {
      const reviewMeta = $("reviewMeta");
      const reviewBoard = $("reviewBoard");
      if (!reviewMeta || !reviewBoard) return;

      const statusTypes = [
        { key: "favorite", label: "\uAD00\uC2EC", tone: "favorite", icon: "star" },
        ...REVIEW_TYPES
      ];
      const groups = statusTypes.map((type) => {
        const list = state.bids.filter((item) => reviewState(item)[type.key]).sort((a, b) => {
          const ra = reviewState(a).updatedAt || "";
          const rb = reviewState(b).updatedAt || "";
          return rb.localeCompare(ra);
        });
        return { type, list };
      });
      const reviewedIds = new Set(groups.flatMap((group) => group.list.map((item) => item.bidNtceNo)));
      reviewMeta.textContent = reviewedIds.size.toLocaleString("ko-KR") + "\uAC74";
      reviewBoard.innerHTML = groups.map(({ type, list }) => {
        const items = list.slice(0, 12).map((item) => {
          const review = reviewState(item);
          const note = type.key === "favorite"
            ? "\uB9C8\uAC10 " + dday(item.bidClseDt).text + " \u00B7 " + money(item.assignBudgetAmt)
            : safe(review[type.noteKey], "\uC0AC\uC720 \uBBF8\uC785\uB825");
          return `
            <button class="status-item ${state.selectedId === item.bidNtceNo ? "selected" : ""}" data-select="${item.bidNtceNo}">
              <span class="status-item-title">${safe(item.bidNtceNm)}</span>
              <span class="status-item-note">${escapeHtml(note)}</span>
            </button>
          `;
        }).join("") || `<div class="status-card-empty">${type.empty || "관심 사업이 없습니다."}</div>`;
        return `
          <section class="status-card">
            <div class="status-card-head">
              <span><i data-lucide="${type.icon}"></i> ${type.label}</span>
              <span class="badge ${type.tone}">${list.length.toLocaleString("ko-KR")}\uAC74</span>
            </div>
            <div class="status-list">${items}</div>
          </section>
        `;
      }).join("");
      createIcons();
    };

    const kstDateKey = (date) => {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(date);
      const get = (type) => parts.find((part) => part.type === type)?.value || "";
      return get("year") + "-" + get("month") + "-" + get("day");
    };

    const latestExpectedUpdate = (times) => {
      const now = new Date();
      const todayStart = new Date(kstDateKey(now) + "T00:00:00+09:00");
      const dayKeys = [
        kstDateKey(new Date(todayStart.getTime() - 86400000)),
        kstDateKey(todayStart)
      ];
      return dayKeys.flatMap((dayKey) => times.map((time) => new Date(dayKey + "T" + time + ":00+09:00")))
        .filter((date) => date.getTime() <= now.getTime())
        .sort((a, b) => b.getTime() - a.getTime())[0] || null;
    };

    const renderSyncHealth = () => {
      const element = $("syncHealth");
      if (!element) return;
      const meta = state.dataMeta || {};
      const times = meta.updateSchedule?.times || ["07:00", "11:00", "16:00"];
      const generated = meta.generatedAt ? new Date(meta.generatedAt) : null;
      const expected = latestExpectedUpdate(times);
      const now = new Date();
      let tone = "pending";
      let label = "\uC5C5\uB370\uC774\uD2B8 \uD655\uC778 \uC911";

      if (!generated || Number.isNaN(generated.getTime())) {
        tone = "error";
        label = "\uC5C5\uB370\uC774\uD2B8 \uBBF8\uD655\uC778";
      } else if (number(meta.failedCalls) > 0) {
        tone = "warning";
        label = "\uBD80\uBD84 \uC131\uACF5 \u00B7 " + number(meta.failedCalls).toLocaleString("ko-KR") + "\uAC74 \uC624\uB958";
      } else if (expected && generated.getTime() < expected.getTime() - 300000) {
        const graceEnd = expected.getTime() + 45 * 60000;
        if (now.getTime() <= graceEnd) {
          tone = "pending";
          label = "\uC608\uC815 \uC5C5\uB370\uC774\uD2B8 \uC9C4\uD589 \uC911";
        } else {
          tone = "error";
          label = "\uC5C5\uB370\uC774\uD2B8 \uC9C0\uC5F0";
        }
      } else {
        tone = "healthy";
        label = "\uC5C5\uB370\uC774\uD2B8 \uC815\uC0C1";
      }

      element.dataset.tone = tone;
      element.textContent = label;
      element.title = "\uB9C8\uC9C0\uB9C9 \uC131\uACF5 " + (generated ? formatKst(generated) + " KST" : "\uBBF8\uD655\uC778")
        + (expected ? " \u00B7 \uCD5C\uADFC \uC608\uC815 " + formatKst(expected) + " KST" : "");
    };

    const renderMetrics = () => {
      const urgent = state.bids.filter((item) => {
        const d = daysLeft(item.bidClseDt);
        return isActiveDeadline(item.bidClseDt) && d != null && d <= 7;
      });
      const bid = state.bids.filter((item) => item.serviceType === "\uACF5\uACE0").length;
      const spec = state.bids.filter((item) => item.serviceType === "\uC0AC\uC804\uADDC\uACA9").length;
      const plan = state.bids.filter((item) => item.serviceType === "\uBC1C\uC8FC\uACC4\uD68D").length;

      $("mUrgent").textContent = urgent.length.toLocaleString("ko-KR");
      $("mNew").textContent = state.bids.filter(isToday).length.toLocaleString("ko-KR");
      $("mLarge").textContent = state.bids.filter((item) => number(item.assignBudgetAmt) >= 200000000).length.toLocaleString("ko-KR");
      $("mTotal").textContent = state.bids.length.toLocaleString("ko-KR");
      $("mService").textContent = `\uACF5\uACE0 ${bid} / \uC0AC\uC804 ${spec} / \uACC4\uD68D ${plan}`;
      $("quickNewCount").textContent = state.bids.filter(isNewToday).length.toLocaleString("ko-KR");
      $("quickChangedCount").textContent = state.bids.filter(isChangedToday).length.toLocaleString("ko-KR");
      $("quick3Count").textContent = state.bids.filter((item) => isWithinDays(item, 3)).length.toLocaleString("ko-KR");
      $("quick7Count").textContent = state.bids.filter((item) => isWithinDays(item, 7)).length.toLocaleString("ko-KR");
      $("quickFavoriteCount").textContent = state.bids.filter((item) => reviewState(item).favorite).length.toLocaleString("ko-KR");
    };

    const renderPriority = () => {
      const todayAll = state.bids.filter(isToday).sort(postedNewest);
      const todayItems = uniqueBy(
        todayAll,
        (item) => [item.bidNtceNm, item.dminsttNm || item.ntceInsttNm].map((value) => safe(value, "")).join("|")
      );
      const urgentItems = uniqueBy(
        [...state.bids].filter((item) => isActiveDeadline(item.bidClseDt)).sort((a, b) => score(b) - score(a)),
        (item) => [item.bidNtceNm, item.dminsttNm || item.ntceInsttNm].map((value) => safe(value, "")).join("|")
      );
      const favoriteItems = state.bids
        .filter((item) => reviewState(item).favorite)
        .sort((a, b) => score(b) - score(a));

      const sources = { today: todayItems, urgent: urgentItems, favorite: favoriteItems };
      const titles = { today: "\uC624\uB298 \uC5C5\uB370\uC774\uD2B8", urgent: "\uB9C8\uAC10 \uC6B0\uC120 \uC0AC\uC5C5", favorite: "\uAD00\uC2EC \uC0AC\uC5C5" };
      const source = sources[state.priorityMode] || todayItems;
      const top = source.slice(0, 5);

      $("priorityTitle").textContent = titles[state.priorityMode] || titles.today;
      $("todayCount").textContent = todayAll.length.toLocaleString("ko-KR");
      $("priorityMeta").textContent = state.priorityMode === "today"
        ? todayAll.length.toLocaleString("ko-KR") + "\uAC74 \u00B7 " + todayItems.length.toLocaleString("ko-KR") + "\uAC1C \uC0AC\uC5C5"
        : "\uC0C1\uC704 " + top.length.toLocaleString("ko-KR") + "\uAC74";
      document.querySelectorAll("[data-priority-mode]").forEach((button) => {
        const active = button.dataset.priorityMode === state.priorityMode;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
      });

      $("priorityList").innerHTML = top.map((item) => {
        const d = dday(item.bidClseDt);
        const postedTime = safe(item.bidNtceRegistDt, "").slice(11, 16);
        const favorite = reviewState(item).favorite;
        const participationInfo = item._participation;
        return `
          <button class="priority-card ${state.selectedId === item.bidNtceNo ? "selected" : ""}" data-select="${item.bidNtceNo}">
            <div class="badge-row">
              <span class="badge ${typeClass(item)}">${typeLabel(item)}</span>
              ${state.priorityMode === "today"
                ? `<span class="badge ${isRevision(item) ? "changed" : "green"}">${isRevision(item) ? "\uC815\uC815" : "\uC2E0\uADDC"} \u00B7 ${postedTime}</span>`
                : `<span class="badge ${d.tone === "red" ? "red" : d.tone === "orange" ? "changed" : "gray"}">${d.text}</span>`}
              ${favorite ? '<span class="badge favorite">\uAD00\uC2EC</span>' : ""}
              <span class="badge ${participationTone(participationInfo.key)}">${participationInfo.label}</span>
              <span class="badge gray">${contractLabel(item)}</span>
            </div>
            <div class="title-main">${safe(item.bidNtceNm)}</div>
            <div class="title-sub">${safe(item.dminsttNm || item.ntceInsttNm)} \u00B7 ${money(item.assignBudgetAmt)}</div>
            <div class="classification-line"><strong class="${keywordTone(item._keyword.primaryLabel)}">${escapeHtml(item._keyword.primaryLabel)}</strong><span>· ${escapeHtml(item._keyword.workLabel)}</span></div>
          </button>
        `;
      }).join("") || `<div class="empty">${state.priorityMode === "today" ? "\uC624\uB298 \uB4F1\uB85D\uB41C \uC0AC\uC5C5\uC774 \uC5C6\uC2B5\uB2C8\uB2E4." : state.priorityMode === "favorite" ? "\uAD00\uC2EC \uC0AC\uC5C5\uC774 \uC5C6\uC2B5\uB2C8\uB2E4." : "\uC6B0\uC120 \uD655\uC778 \uC0AC\uC5C5\uC774 \uC5C6\uC2B5\uB2C8\uB2E4."}</div>`;
    };

    const populateAdvancedFilters = () => {
      const visibleGroups = KEYWORD_GROUPS.filter((group) => !group.hidden);
      const sections = [...new Set(visibleGroups.map((group) => group.section))];
      const keywordOptions = sections.map((section) => {
        const options = visibleGroups.filter((group) => group.section === section).map((group) => {
          const count = state.bids.filter((item) => matchesKeywordGroup(item, group.id)).length;
          return `<option value="${group.id}">${escapeHtml(group.label)} (${count.toLocaleString("ko-KR")})</option>`;
        }).join("");
        return `<optgroup label="${escapeHtml(section)}">${options}</optgroup>`;
      }).join("");
      const workOptions = WORK_GROUPS.map((group) => {
        const count = state.bids.filter((item) => item._keyword.works.includes(group.id)).length;
        return `<option value="${group.id}">${escapeHtml(group.label)} (${count.toLocaleString("ko-KR")})</option>`;
      }).join("");
      const participationOptions = [
        { id: "possible", label: "참여 가능" },
        { id: "check", label: "확인 필요" },
        { id: "restricted", label: "참여 제한" },
        { id: "closed", label: "마감" }
      ].map((option) => {
        const count = state.bids.filter((item) => item._participation.key === option.id).length;
        return `<option value="${option.id}">${option.label} (${count.toLocaleString("ko-KR")})</option>`;
      }).join("");

      $("filterKeywordDetail").innerHTML = `<option value="ALL">전체 상세 분류</option>${keywordOptions}`;
      $("filterWork").innerHTML = `<option value="ALL">전체 업무 유형</option>${workOptions}`;
      $("filterParticipation").innerHTML = `<option value="ALL">전체 참여 판단</option>${participationOptions}`;
      syncFilterControls();
    };

    const renderListMode = () => {
      const todayTotal = state.bids.filter(isToday).length;
      const dateCounts = state.bids.reduce((counts, item) => {
        const key = postedDateKey(item);
        if (isDateListMode(key)) counts.set(key, (counts.get(key) || 0) + 1);
        return counts;
      }, new Map());
      const selectedDate = isDateListMode(state.listMode) ? state.listMode : "";
      const dateSelect = $("filterDate");
      $("allListCount").textContent = state.bids.length.toLocaleString("ko-KR");
      $("todayListCount").textContent = todayTotal.toLocaleString("ko-KR");
      dateSelect.innerHTML = `<option value="">\uB4F1\uB85D \uB0A0\uC9DC \uC120\uD0DD</option>${[...dateCounts.entries()]
        .sort(([a], [b]) => b.localeCompare(a))
        .map(([date, count]) => `<option value="${date}">${dateLabel(date)} \u00B7 ${count.toLocaleString("ko-KR")}\uAC74</option>`)
        .join("")}`;
      dateSelect.value = selectedDate;
      $("dateFilterControl").classList.toggle("active", Boolean(selectedDate));
      document.querySelectorAll("[data-list-mode]").forEach((button) => {
        const active = button.dataset.listMode === state.listMode;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
      });
    };

    const renderRows = () => {
      state.filtered = filteredByView();
      if (state.filtered.length && !state.filtered.some((item) => item.bidNtceNo === state.selectedId)) {
        state.selectedId = state.filtered[0].bidNtceNo;
      }
      if (!state.filtered.length) state.selectedId = "";

      const resultMeta = $("resultMeta");
      if (resultMeta) {
        const modeLabels = {
          today: "\uC624\uB298 \uC0AC\uC5C5",
          newToday: "\uC624\uB298 \uC2E0\uADDC",
          changedToday: "\uC624\uB298 \uC815\uC815",
          recent3: "\uCD5C\uADFC 3\uC77C",
          recent7: "\uCD5C\uADFC 7\uC77C",
          favorite: "\uAD00\uC2EC \uC0AC\uC5C5"
        };
        if (isDateListMode(state.listMode)) {
          resultMeta.textContent = dateLabel(state.listMode) + " \uC0AC\uC5C5 " + state.filtered.length.toLocaleString("ko-KR") + "\uAC74 \uD45C\uC2DC";
        } else if (state.listMode !== "all") {
          resultMeta.textContent = (modeLabels[state.listMode] || "\uC120\uD0DD \uC0AC\uC5C5") + " " + state.filtered.length.toLocaleString("ko-KR") + "\uAC74 \uD45C\uC2DC";
        } else {
          const todayVisible = state.filtered.filter(isToday).length;
          resultMeta.textContent = "\uC624\uB298 " + todayVisible.toLocaleString("ko-KR") + "\uAC74 \uBA3C\uC800 \u00B7 "
            + state.filtered.length.toLocaleString("ko-KR") + "\uAC74 \uD45C\uC2DC / \uC804\uCCB4 "
            + state.bids.length.toLocaleString("ko-KR") + "\uAC74"
            + (state.scopeExcludedCount ? " \u00B7 LED \uBE44\uB300\uC0C1 " + state.scopeExcludedCount.toLocaleString("ko-KR") + "\uAC74 \uC81C\uC678" : "");
        }
      }

      $("bidRows").innerHTML = state.filtered.map((item) => {
        const c = contact(item);
        const d = dday(item.bidClseDt);
        const r = reviewState(item);
        const participationInfo = item._participation;
        const revised = isRevision(item);
        const relatedCount = relatedItems(item).length;
        const revision = safe(item.bidNtceOrd, "").replace(/^0+/, "") || "0";
        return `
          <tr class="${state.selectedId === item.bidNtceNo ? "selected" : ""}" data-select="${item.bidNtceNo}">
            <td>
              <div class="title-cell">
                <div class="business-title-row">
                  <button class="favorite-button ${r.favorite ? "active" : ""}" type="button" data-favorite="${item.bidNtceNo}" title="${r.favorite ? "\uAD00\uC2EC \uD574\uC81C" : "\uAD00\uC2EC \uC124\uC815"}" aria-label="${r.favorite ? "\uAD00\uC2EC \uD574\uC81C" : "\uAD00\uC2EC \uC124\uC815"}"><i data-lucide="star"></i></button>
                  <span class="contract-prefix" title="${contractLabel(item)}">${contractLabel(item)}</span>
                  <div class="title-main">${safe(item.bidNtceNm)}</div>
                </div>
                <div class="title-sub">${safe(item.dminsttNm || item.ntceInsttNm)} \u00B7 ${safe(item.region)}</div>
                <div class="title-sub published-date">${isToday(item) ? `<span class="today-marker">\uC624\uB298</span>` : ""}등록 ${safe(item.bidNtceRegistDt)}</div>
                <div class="classification-line">
                  <strong class="${keywordTone(item._keyword.primaryLabel)}">${escapeHtml(item._keyword.primaryLabel)}</strong>
                  <span>· ${escapeHtml(item._keyword.workLabel)}</span>
                  <span class="classification-evidence">${escapeHtml(item._keyword.evidence)}${item._keyword.matchedTerm ? ` “${escapeHtml(item._keyword.matchedTerm)}”` : ""}</span>
                </div>
                <div class="badge-row">
                  ${isToday(item) && !revised ? '<span class="badge green">\uC2E0\uADDC</span>' : ""}
                  ${revised ? `<span class="badge changed">\uC815\uC815 ${revision}\uCC28</span>` : ""}
                  ${relatedCount ? `<span class="badge gray">\uAD00\uB828 ${relatedCount}\uAC74</span>` : ""}
                  <span class="badge ${participationTone(participationInfo.key)}">${participationInfo.label}</span>
                  ${r.checked ? '<span class="badge green">\uCCB4\uD06C</span>' : ""}
                  ${r.issue ? '<span class="badge red">\uC774\uC288</span>' : ""}
                  ${r.done ? '<span class="badge gray">\uC644\uB8CC</span>' : ""}
                </div>
              </div>
            </td>
            <td><span class="badge ${typeClass(item)}">${typeLabel(item)}</span></td>
            <td><span class="money">${money(item.assignBudgetAmt)}</span></td>
            <td>
              <span class="dday ${d.tone}">${d.text}</span>
              <div class="schedule-stack">
                <div class="schedule-line"><strong>등록</strong><span>${shortDateTime(item.bidNtceRegistDt)}</span></div>
                <div class="schedule-line"><strong>${item.serviceType === "발주계획" ? "예정" : "마감"}</strong><span>${shortDateTime(item.bidClseDt)}${d.sub ? ` / ${d.sub}` : ""}</span></div>
              </div>
            </td>
            <td><strong>${c.name}</strong><div class="title-sub">${c.tel}</div></td>
          </tr>
        `;
      }).join("") || '<tr><td colspan="5"><div class="empty">\uC870\uAC74\uC5D0 \uB9DE\uB294 \uC0AC\uC5C5\uC774 \uC5C6\uC2B5\uB2C8\uB2E4.</div></td></tr>';
    };

    const noteField = (type, review) => `
      <label class="note-field ${review[type.key] ? "active" : ""}">
        <span class="note-label">
          <span>${type.noteLabel}</span>
          <span class="badge ${review[type.key] ? type.tone : "gray"}">${review[type.key] ? type.active : "\uBBF8\uD45C\uC2DC"}</span>
        </span>
        <textarea data-note="${type.key}" rows="3" placeholder="${type.placeholder}">${escapeHtml(review[type.noteKey] || "")}</textarea>
      </label>
    `;

    const renderDetail = () => {
      const item = state.bids.find((bid) => bid.bidNtceNo === state.selectedId);
      if (!item) {
        $("detailState").textContent = "\uBBF8\uC120\uD0DD";
        $("detailBody").innerHTML = '<div class="empty">\uBAA9\uB85D\uC5D0\uC11C \uC0AC\uC5C5\uC744 \uC120\uD0DD\uD558\uC138\uC694.</div>';
        return;
      }

      const c = contact(item);
      const d = dday(item.bidClseDt);
      const r = reviewState(item);
      const detail = item.detailInfo || {};
      const participationInfo = item._participation;
      const revision = revisionChanges(item);
      const related = relatedItems(item);
      const revisionOrder = safe(item.bidNtceOrd, "").replace(/^0+/, "") || "0";
      const history = [...(Array.isArray(r.history) ? r.history : [])].reverse().slice(0, 8);
      const statusLabel = r.issue ? "\uC774\uC288" : r.checked ? "\uCCB4\uD06C" : r.done ? "\uC644\uB8CC" : r.favorite ? "\uAD00\uC2EC" : "\uBBF8\uAC80\uD1A0";
      $("detailState").textContent = statusLabel;

      const relatedMarkup = related.map((candidate) => {
        const candidateOrder = safe(candidate.bidNtceOrd, "").replace(/^0+/, "") || "0";
        const content = `
          <div class="related-item-title">${safe(candidate.bidNtceNm)}</div>
          <div class="related-item-meta">${typeLabel(candidate)} \u00B7 ${candidateOrder}\uCC28 \u00B7 ${safe(candidate.bidNtceRegistDt)}</div>
        `;
        return candidate.bidNtceNo === item.bidNtceNo
          ? `<div class="related-item">${content}</div>`
          : `<button class="related-item" type="button" data-select="${candidate.bidNtceNo}">${content}</button>`;
      }).join("");

      const historyMarkup = history.map((entry) => `
        <div class="history-item">
          <strong>${escapeHtml(entry.action || "\uC0C1\uD0DC \uBCC0\uACBD")}</strong>
          ${entry.note ? `<div class="history-item-note">${escapeHtml(entry.note)}</div>` : ""}
          <div class="history-item-meta">${formatKst(entry.at)} KST · ${escapeHtml(entry.by || "공용 사용자")}</div>
        </div>
      `).join("");

      $("detailBody").innerHTML = `
        <div class="badge-row">
          <span class="badge ${typeClass(item)}">${typeLabel(item)}</span>
          <span class="badge ${d.tone === "red" ? "red" : d.tone === "orange" ? "changed" : "gray"}">${d.text}</span>
          ${isRevision(item) ? `<span class="badge changed">\uC815\uC815 ${revisionOrder}\uCC28</span>` : `<span class="badge green">\uC2E0\uADDC</span>`}
          <span class="badge ${participationTone(participationInfo.key)}">${participationInfo.label}</span>
          ${r.favorite ? '<span class="badge favorite">\uAD00\uC2EC</span>' : ""}
          <span class="badge gray">${safe(item.bidNtceNo)}</span>
        </div>
        <h2 class="detail-title">${safe(item.bidNtceNm)}</h2>
        ${revision.labels.length ? `<div class="note-empty">\uC774\uC804 \uCC28\uC218 \uB300\uBE44 \uBCC0\uACBD: ${revision.labels.join(", ")}</div>` : ""}
        <div class="participation-summary ${participationInfo.key}">
          <div class="participation-summary-head"><span>참여 판단</span><span class="badge ${participationTone(participationInfo.key)}">${participationInfo.label}</span></div>
          <p>${escapeHtml(participationInfo.reason)}</p>
        </div>
        <div class="field-grid">
          ${field("\uC218\uC694\uAE30\uAD00", item.dminsttNm, { changed: revision.keys.has("institution") })}
          ${field("\uACF5\uACE0\uAE30\uAD00", item.ntceInsttNm)}
          ${field("등록일", item.bidNtceRegistDt)}
          ${field("공고 구분", detail.noticeKind)}
          ${field("\uC608\uC0B0", money(item.assignBudgetAmt), { changed: revision.keys.has("budget") })}
          ${field("\uB9C8\uAC10/\uC608\uC815", `${safe(item.bidClseDt)} / ${d.text}${d.sub ? ` (${d.sub})` : ""}`, { changed: revision.keys.has("deadline") })}
          ${field("\uB2F4\uB2F9\uC790", c.name)}
          ${field("\uC804\uD654", c.tel)}
          ${field("담당 부서/이메일", `${safe(c.dept)} / ${safe(c.email)}`)}
          ${field("\uACC4\uC57D\uBC29\uBC95", item.contractMethod || item.contractMethodRaw, { changed: revision.keys.has("contract") })}
          ${field("입찰/낙찰 방법", `${safe(detail.bidMethod)} / ${safe(detail.awardMethod)}`)}
          ${field("지역 제한", detail.restrictionRegion || item.region)}
          ${field("참가등록 마감", detail.registerDeadline)}
          ${field("입찰 시작/개찰", `${safe(detail.bidBeginDt)} / ${safe(detail.openDt)}`)}
          ${field("\uD0A4\uC6CC\uB4DC/\uC9C0\uC5ED", `${safe(item.searchKeyword)} / ${safe(item.region)}`)}
          ${field("상세 분류", `${item._keyword.primaryLabel} / ${item._keyword.workLabel}`)}
          ${field("검색 근거", `${item._keyword.evidence}${item._keyword.matchedTerm ? ` - ${item._keyword.matchedTerm}` : ""}`)}
          ${field("품명/세부품목", `${safe(detail.productName)} / ${safe(detail.productDetails)}`)}
          ${field("사용 목적", detail.purpose)}
        </div>
        <div class="detail-actions">
          <button class="favorite ${r.favorite ? "active" : ""}" data-action="favorite"><i data-lucide="star"></i><span>${r.favorite ? "\uAD00\uC2EC \uD574\uC81C" : "\uAD00\uC2EC"}</span></button>
          <button class="${r.checked ? "active" : ""}" data-action="checked"><i data-lucide="check-circle"></i><span>${r.checked ? "\uCCB4\uD06C \uD574\uC81C" : "\uCCB4\uD06C"}</span></button>
          <button class="${r.issue ? "active issue" : ""}" data-action="issue"><i data-lucide="badge-alert"></i><span>${r.issue ? "\uC774\uC288 \uD574\uC81C" : "\uC774\uC288"}</span></button>
          <button class="${r.done ? "active done" : ""}" data-action="done"><i data-lucide="circle-check-big"></i><span>${r.done ? "\uC644\uB8CC \uD574\uC81C" : "\uC644\uB8CC"}</span></button>
          <button data-action="copy"><i data-lucide="copy"></i><span>\uC694\uC57D \uBCF5\uC0AC</span></button>
          <a class="detail-link primary" href="${safe(item.g2bUrl, "https://www.g2b.go.kr")}" target="_blank" rel="noopener">
            <i data-lucide="external-link"></i><span>\uB098\uB77C\uC7A5\uD130 \uC6D0\uBB38</span>
          </a>
        </div>
        <div class="note-grid">
          ${REVIEW_TYPES.filter((type) => r[type.key]).map((type) => noteField(type, r)).join("") || '<div class="note-empty">\uCCB4\uD06C, \uC774\uC288, \uC644\uB8CC \uC911 \uD558\uB098\uB97C \uC120\uD0DD\uD558\uBA74 \uD574\uB2F9 \uC0AC\uC720 \uC785\uB825\uCE78\uC774 \uD45C\uC2DC\uB429\uB2C8\uB2E4.</div>'}
        </div>
        ${related.length ? `
          <section class="related-section">
            <h3 class="section-heading"><span>\uC774\uC804 \uCC28\uC218/\uAD00\uB828 \uACF5\uACE0</span><span class="badge gray">${related.length}\uAC74</span></h3>
            <div class="related-list">${relatedMarkup}</div>
          </section>
        ` : ""}
        ${history.length ? `
          <section class="history-section">
            <h3 class="section-heading"><span>\uD65C\uB3D9 \uC774\uB825</span><span class="badge gray">${history.length}\uAC74</span></h3>
            <div class="history-list">${historyMarkup}</div>
          </section>
        ` : ""}
      `;
      createIcons();
    };

    const field = (label, value, options = {}) => `
      <div class="field ${options.changed ? "changed" : ""}">
        <div class="field-label-row">
          <div class="field-label">${label}</div>
          ${options.changed ? '<span class="badge changed">\uBCC0\uACBD</span>' : ""}
        </div>
        <div class="field-value">${safe(value)}</div>
      </div>
    `;

    const copySummary = async () => {
      const item = state.bids.find((bid) => bid.bidNtceNo === state.selectedId);
      if (!item) return;
      const c = contact(item);
      const deadline = dday(item.bidClseDt);
      const review = reviewState(item);
      const reviewLines = REVIEW_TYPES
        .filter((type) => review[type.key] || safe(review[type.noteKey], ""))
        .map((type) => `${type.label}: ${safe(review[type.noteKey], "\uC0AC\uC720 \uBBF8\uC785\uB825")}`);
      const text = [
        `[DI \uC870\uB2EC \uAC80\uD1A0] ${safe(item.bidNtceNm)}`,
        `\uC720\uD615: ${typeLabel(item)} / \uBC88\uD638: ${safe(item.bidNtceNo)}`,
        `\uAE30\uAD00: ${safe(item.dminsttNm || item.ntceInsttNm)}`,
        `\uAC8C\uC2DC/\uB4F1\uB85D: ${safe(item.bidNtceRegistDt)}`,
        `상세 분류: ${item._keyword.primaryLabel} / ${item._keyword.workLabel}`,
        `참여 판단: ${item._participation.label} - ${item._participation.reason}`,
        `\uC608\uC0B0: ${money(item.assignBudgetAmt)}`,
        `\uB9C8\uAC10: ${safe(item.bidClseDt)} (${deadline.text}${deadline.sub ? ` / ${deadline.sub}` : ""})`,
        ...reviewLines,
        `\uB2F4\uB2F9: ${c.name} / ${c.tel}`,
        `\uC6D0\uBB38: ${safe(item.g2bUrl, "https://www.g2b.go.kr")}`
      ].join("\n");
      await navigator.clipboard.writeText(text);
    };

    const render = () => {
      renderSyncHealth();
      renderMetrics();
      renderPriority();
      renderListMode();
      renderRows();
      renderStatusBoard();
      renderDetail();
      renderSideTabs();
      renderSavedFilters();
      createIcons();
    };

    const loadData = async () => {
      $("lastUpdated").textContent = "\uB370\uC774\uD130 \uB85C\uB529 \uC911";
      $("syncHealth").dataset.tone = "pending";
      $("syncHealth").textContent = "\uC5C5\uB370\uC774\uD2B8 \uD655\uC778 \uC911";
      const response = await fetch(`./data/bids.json?t=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      state.rawBids = Array.isArray(payload.bids) ? payload.bids : [];
      const enrichedBids = dedupeBids(state.rawBids).map(enrichBid);
      state.scopeExcludedCount = enrichedBids.filter((item) => item._scope.excluded).length;
      state.bids = enrichedBids.filter((item) => !item._scope.excluded);
      state.dataMeta = payload;
      const times = payload.updateSchedule?.times || ["07:00", "11:00", "16:00"];
      $("lastUpdated").textContent = payload.generatedAt ? `\uCD5C\uC885 \uC5C5\uB370\uC774\uD2B8 ${formatKst(payload.generatedAt)} KST` : "\uC5C5\uB370\uC774\uD2B8 \uC2DC\uAC01 \uBBF8\uD655\uC778";
      $("nextUpdate").textContent = `\uC608\uC815 ${times.join(", ")} KST`;
      populateAdvancedFilters();
      state.selectedId = [...state.bids].sort(todayFirst)[0]?.bidNtceNo || "";
      render();
    };

    document.addEventListener("click", (event) => {
      if (event.target.closest("#mobileDetailClose")) {
        closeMobileSide();
        return;
      }

      const favoriteKey = event.target.closest("[data-favorite]")?.dataset.favorite;
      if (favoriteKey) {
        const current = reviewState({ bidNtceNo: favoriteKey });
        setReview(favoriteKey, { favorite: !current.favorite });
        return;
      }

      const listMode = event.target.closest("[data-list-mode]")?.dataset.listMode;
      if (listMode) {
        state.listMode = listMode;
        state.savedFilterId = "";
        render();
        return;
      }

      const priorityMode = event.target.closest("[data-priority-mode]")?.dataset.priorityMode;
      if (priorityMode) {
        state.priorityMode = priorityMode;
        renderPriority();
        createIcons();
        return;
      }

      const sideTab = event.target.closest("[data-side-tab]")?.dataset.sideTab;
      if (sideTab) {
        state.sideTab = sideTab;
        renderSideTabs();
        openMobileSide();
        createIcons();
        return;
      }

      const select = event.target.closest("[data-select]");
      if (select) {
        state.selectedId = select.dataset.select;
        if (select.closest("#reviewBoard")) state.sideTab = "detail";
        render();
        openMobileSide();
        return;
      }

      const action = event.target.closest("[data-action]")?.dataset.action;
      if (!action || !state.selectedId) return;
      const r = reviewState({ bidNtceNo: state.selectedId });
      if (action === "favorite") setReview(state.selectedId, { favorite: !r.favorite });
      if (action === "checked") setReview(state.selectedId, { checked: !r.checked });
      if (action === "issue") setReview(state.selectedId, { issue: !r.issue });
      if (action === "done") setReview(state.selectedId, { done: !r.done });
      if (action === "copy") copySummary();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeMobileSide();
    });

    $("mobileDetailClose").addEventListener("click", (event) => {
      event.stopPropagation();
      closeMobileSide();
    });

    document.addEventListener("input", (event) => {
      const noteType = event.target.closest("[data-note]")?.dataset.note;
      if (!noteType || !state.selectedId) return;
      const type = reviewTypeByKey(noteType);
      if (!type) return;
      setReviewNote(state.selectedId, type, event.target.value);
    });

    document.addEventListener("change", (event) => {
      const noteType = event.target.closest("[data-note]")?.dataset.note;
      if (!noteType || !state.selectedId) return;
      const type = reviewTypeByKey(noteType);
      if (!type) return;
      setReviewNote(state.selectedId, type, event.target.value, true);
    });

    const updateFiltersFromControls = () => {
      state.savedFilterId = "";
      state.filters = {
        service: $("filterService").value,
        contract: $("filterContract").value,
        keyword: $("filterKeyword").value,
        keywordDetail: $("filterKeywordDetail").value,
        work: $("filterWork").value,
        participation: $("filterParticipation").value,
        region: $("filterRegion").value,
        budget: $("filterBudget").value
      };
      render();
    };

    $("filterControls").addEventListener("change", updateFiltersFromControls);
    $("advancedFilterControls").addEventListener("change", updateFiltersFromControls);

    $("filterDate").addEventListener("change", (event) => {
      state.savedFilterId = "";
      state.listMode = event.target.value || "all";
      render();
    });

    $("searchInput").addEventListener("input", (event) => {
      state.savedFilterId = "";
      state.query = event.target.value;
      render();
    });

    $("reviewerNameInput").value = state.reviewerName;
    $("reviewerNameInput").addEventListener("change", (event) => {
      state.reviewerName = event.target.value.trim();
      localStorage.setItem(REVIEWER_KEY, state.reviewerName);
    });

    $("savedFilter").addEventListener("change", (event) => {
      if (event.target.value) applySavedFilter(event.target.value);
      else {
        state.savedFilterId = "";
        renderSavedFilters();
      }
    });

    $("saveFilterBtn").addEventListener("click", saveCurrentFilter);
    $("deleteFilterBtn").addEventListener("click", deleteSavedFilter);
    $("resetFiltersBtn").addEventListener("click", resetFilters);

    $("refreshBtn").addEventListener("click", () => {
      loadData().catch((error) => {
        $("lastUpdated").textContent = `\uB85C\uB4DC \uC2E4\uD328: ${error.message}`;
        $("syncHealth").dataset.tone = "error";
        $("syncHealth").textContent = "\uC5C5\uB370\uC774\uD2B8 \uB85C\uB4DC \uC2E4\uD328";
      });
    });

    loadData().catch((error) => {
      $("lastUpdated").textContent = `\uB85C\uB4DC \uC2E4\uD328: ${error.message}`;
      $("syncHealth").dataset.tone = "error";
      $("syncHealth").textContent = "\uC5C5\uB370\uC774\uD2B8 \uB85C\uB4DC \uC2E4\uD328";
      $("bidRows").innerHTML = `<tr><td colspan="5"><div class="empty">\uB370\uC774\uD130\uB97C \uBD88\uB7EC\uC624\uC9C0 \uBABB\uD588\uC2B5\uB2C8\uB2E4.</div></td></tr>`;
    });
    initializeReviewSync();
